<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Chief of Staff</title>
  <link rel="stylesheet" href="/static/cos.css?v=20261015-dictation1">
</head>
<body>

  <!-- ── Sticky dark header ── -->
  <header class="cos-header">
    <div class="header-nav">
      <a href="/ui" class="brand">Chief of Staff</a>
      <nav class="tab-nav">
        <button class="tab-btn" data-tab="confer">Confer</button>
        <button class="tab-btn" data-tab="record">Record</button>
        <button class="tab-btn" data-tab="track">Track</button>
        <button class="tab-btn" data-tab="store">Store</button>
      </nav>
      <span class="dev-badge">IN BUILD</span>
      <div class="backend-badge" id="backend-badge">···</div>
    </div>
  </header>

  <!-- ── Two-column split: content left, photo right ── -->
  <div class="tab-layout-split">

    <!-- ── Left: tab content panels ── -->
    <div class="tab-content">

      <!-- Confer -->
      <div id="tab-confer" class="tab-panel">
        <div class="tab-split-header">
          <div class="tab-hero-label">[CHICAGO]</div>
          <h1>Confer</h1>
        </div>
        <div id="chat-log"></div>
        <div class="input-row">
          <input id="send-input" type="text" placeholder="Message CoS…" autocomplete="off" autofocus>
          <button id="btn-voice" title="Start voice conversation" aria-label="Start voice conversation">🎤</button>
          <button id="btn-dictate" type="button" disabled aria-label="Dictate into the message draft">Dictate</button>
          <button id="btn-send">Send</button>
        </div>
        <div class="talk-meta">
          <span id="voice-status"></span>
          <span id="voice-provider"></span>
          <span>Voice is AI-generated.</span>
          <a href="/ui/memory" target="_blank">memory ↗</a>
        </div>
        {% if managed_realtime_ready %}
        <label>Voice mode <select id="voice-mode"><option value="realtime">Realtime · OpenAI</option><option value="chained">Voice · turn by turn</option></select></label>
        <label><input type="checkbox" id="voice-keep-transcript">Download transcript on End</label>
        {% endif %}
        <div id="voice-transcript" aria-live="polite"></div>
      </div>

      <!-- Record -->
      <div id="tab-record" class="tab-panel">
        <div class="tab-split-header">
          <div class="tab-hero-label">[CHICAGO]</div>
          <h1>Record</h1>
        </div>
        <div id="notes-content" class="loading">Loading…</div>
      </div>

      <!-- Track -->
      <div id="tab-track" class="tab-panel">
        <div class="tab-split-header">
          <div class="tab-hero-label">[CHICAGO]</div>
          <h1>Track</h1>
        </div>
        <div id="todo-content" class="loading">Loading…</div>
      </div>

      <!-- Store -->
      <div id="tab-store" class="tab-panel">
        <div class="tab-split-header">
          <div class="tab-hero-label">[CHICAGO]</div>
          <h1>Store</h1>
        </div>
        <div id="repository-content" class="loading">Loading…</div>
      </div>

    </div><!-- .tab-content -->

    <!-- ── Right: sidebar photos (all pre-loaded, JS shows active) ── -->
    <div class="tab-panel-photo">
      <img src="/static/photos/cos_discuss_private.png?v=1" class="tab-photo" data-tab="confer" style="object-position:center 30%" alt="">
      <img src="/static/photos/cos_notes.jpg"      class="tab-photo" data-tab="record"  style="object-position:center center" alt="">
      <img src="/static/photos/cos_todo.jpg"       class="tab-photo" data-tab="track"  style="object-position:center 40%" alt="">
      <img src="/static/photos/cos_repository.jpg" class="tab-photo" data-tab="store"   style="object-position:center center" alt="">
    </div>

  </div><!-- .tab-layout-split -->

<script>
const INITIAL_TAB = '{{ initial_tab }}';

// ── Tab switching ─────────────────────────────────────────────────────────────
const tabBtns   = document.querySelectorAll('.tab-btn');
const tabPanels = document.querySelectorAll('.tab-panel');
const tabPhotos = document.querySelectorAll('.tab-photo');
const tabLoaded = { confer: true, record: false, track: false, store: false };

function activateTab(tab, pushState) {
  tabBtns.forEach(b => b.classList.toggle('active', b.dataset.tab === tab));
  tabPanels.forEach(p => p.classList.toggle('active', p.id === 'tab-' + tab));
  tabPhotos.forEach(img => img.classList.toggle('active', img.dataset.tab === tab));
  if (pushState) history.pushState({tab}, '', tab);
  if (!tabLoaded[tab]) { tabLoaded[tab] = true; loadTab(tab); }
}

tabBtns.forEach(btn => {
  btn.addEventListener('click', () => activateTab(btn.dataset.tab, true));
});

window.addEventListener('popstate', e => {
  const tab = (e.state && e.state.tab) || 'confer';
  activateTab(tab, false);
});

// ── Backend badge ─────────────────────────────────────────────────────────────
async function loadBackendBadge() {
  try {
    const d = await fetch('/status').then(r => r.json());
    const badge = document.getElementById('backend-badge');
    const bl = d.backend_label || '';
    const ml = d.model_label   || '';
    badge.textContent = ml ? `${bl} · ${ml}` : bl || '···';
  } catch(_) {}
}
loadBackendBadge();

// ── Chat (Discuss tab) ────────────────────────────────────────────────────────
const chatLog   = document.getElementById('chat-log');
const sendInput = document.getElementById('send-input');
const btnSend   = document.getElementById('btn-send');

function appendMsg(role, text) {
  const wrap  = document.createElement('div');
  wrap.className = 'msg msg-' + role;
  const label = document.createElement('div');
  label.className = 'msg-label';
  label.textContent = role === 'user' ? 'You' : 'CoS';
  const body  = document.createElement('div');
  body.className = 'msg-text';
  body.textContent = text;
  wrap.appendChild(label);
  wrap.appendChild(body);
  chatLog.appendChild(wrap);
  chatLog.scrollTop = chatLog.scrollHeight;
}

function appendThinking() {
  const el = document.createElement('div');
  el.className = 'msg-thinking';
  el.textContent = 'Thinking…';
  chatLog.appendChild(el);
  chatLog.scrollTop = chatLog.scrollHeight;
  return el;
}

btnSend.addEventListener('click', sendMessage);
sendInput.addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); } });

function cosWriteHeaders() {
  const token = document.querySelector('meta[name="minimoi-csrf-token"]')?.content;
  return token ? { 'X-CSRF-Token': token } : {};
}

async function sendMessage() {
  if(sendInput.disabled||sendInput.readOnly)return;
  const text = sendInput.value.trim();
  if (!text) return;
  const requestId = crypto.randomUUID();
  sendInput.value = '';
  setInputDisabled(true);
  appendMsg('user', text);
  const thinking = appendThinking();
  try {
    const resp = await fetch('/ui/send', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', ...cosWriteHeaders() },
      body: JSON.stringify({
        text,
        channel: 'html_text',
        conversation_id: 'owner',
        request_id: requestId,
      }),
    });
    const data = await resp.json().catch(() => ({}));
    thinking.remove();
    if (!resp.ok || !data || typeof data !== 'object' || Array.isArray(data) || typeof data.reply !== 'string' || !data.reply.trim()) {
      if (!sendInput.value.trim()) sendInput.value = text;
      const confirmedRefusal = resp.status === 403 && data?.error === 'csrf';
      appendMsg('cos', confirmedRefusal
        ? 'Message was not sent: request verification failed. Your draft is preserved.'
        : 'Delivery is unconfirmed. Your draft is preserved; check the record before retrying.');
      return;
    }
    appendMsg('cos', data.reply);
  } catch(err) {
    thinking.remove();
    if (!sendInput.value.trim()) sendInput.value = text;
    appendMsg('cos', 'Delivery is unconfirmed. Your draft is preserved; check the record before retrying.');
  } finally {
    setInputDisabled(false);
    sendInput.focus();
  }
}

function setInputDisabled(disabled) {
  sendInput.disabled = disabled;
  btnSend.disabled   = disabled;
}

// ── Notes tab ─────────────────────────────────────────────────────────────────
async function loadNotes() {
  const el = document.getElementById('notes-content');
  try {
    const entries = await fetch('/ui/api/notes').then(r => r.json());
    if (!entries.length) {
      el.innerHTML = '<p class="empty-state">No memory entries yet.</p>';
      return;
    }
    const sections = {};
    entries.forEach(e => {
      const sec = e.section || 'General';
      if (!sections[sec]) sections[sec] = [];
      sections[sec].push(e);
    });
    let html = '';
    for (const [sec, items] of Object.entries(sections)) {
      html += `<div class="section-divider">${esc(sec)}</div>`;
      items.forEach(e => {
        const tag = e.type || 'chat';
        html += `<div class="entry-card">
          <div class="entry-meta">
            <span class="entry-tag ${esc(tag)}">${esc(tag)}</span>
            <span class="entry-date">${esc(e.date || '')}</span>
          </div>
          <div class="entry-content">${esc(e.content)}</div>
        </div>`;
      });
    }
    el.innerHTML = html;
  } catch(err) {
    el.innerHTML = `<p class="empty-state">Notes unavailable: ${esc(err.message)}</p>`;
  }
}

// ── To-do tab ─────────────────────────────────────────────────────────────────
async function loadTodo() {
  const el = document.getElementById('todo-content');
  try {
    const data = await fetch('/ui/api/todo').then(r => r.json());
    const agenda = data.agenda || [], memActs = data.memory_actions || [];
    let html = '';
    if (agenda.length) {
      html += '<div class="todo-section-title">From CoS recommendations</div>';
      agenda.forEach(item => {
        const conf = item.confidence ? ` · ${Math.round(item.confidence * 100)}% confidence` : '';
        html += `<div class="todo-item">
          <div class="todo-dot"></div>
          <div class="todo-body">
            <div class="todo-content">${esc(item.description || '')}</div>
            <div class="todo-source">${esc(item.domain || 'cos')}${conf} · ${esc((item.created_at || '').slice(0,10))}</div>
          </div>
        </div>`;
      });
    }
    if (memActs.length) {
      html += '<div class="todo-section-title">From memory</div>';
      memActs.forEach(e => {
        html += `<div class="todo-item">
          <div class="todo-dot"></div>
          <div class="todo-body">
            <div class="todo-content">${esc(e.content || '')}</div>
            <div class="todo-source">${esc(e.type)} · ${esc(e.date || '')}</div>
          </div>
        </div>`;
      });
    }
    if (!agenda.length && !memActs.length) {
      html = '<p class="empty-state">No open action items.</p>';
    }
    el.innerHTML = html;
  } catch(err) {
    el.innerHTML = `<p class="empty-state">To-do unavailable: ${esc(err.message)}</p>`;
  }
}

// ── Repository tab ────────────────────────────────────────────────────────────
async function loadRepository() {
  const el = document.getElementById('repository-content');
  try {
    const files = await fetch('/ui/api/repository').then(r => r.json());
    if (!files.length) {
      el.innerHTML = '<p class="empty-state">No agent log files yet.</p>';
      return;
    }
    const groups = {};
    files.forEach(f => {
      if (!groups[f.dir]) groups[f.dir] = [];
      groups[f.dir].push(f);
    });
    let html = '';
    for (const [dir, items] of Object.entries(groups)) {
      html += `<div class="archive-group">
        <div class="archive-group-title">${esc(dir)}</div>`;
      items.forEach(f => {
        const kb = (f.size / 1024).toFixed(1);
        html += `<div class="archive-row">
          <span class="archive-name">${esc(f.name)}</span>
          <span class="archive-meta">${esc(f.mtime)} · ${kb} KB</span>
        </div>`;
      });
      html += '</div>';
    }
    el.innerHTML = html;
  } catch(err) {
    el.innerHTML = `<p class="empty-state">Repository unavailable: ${esc(err.message)}</p>`;
  }
}

// ── Tab loader dispatch ───────────────────────────────────────────────────────
function loadTab(tab) {
  if (tab === 'record') loadNotes();
  if (tab === 'track')  loadTodo();
  if (tab === 'store')  loadRepository();
}

// ── Escape helper ─────────────────────────────────────────────────────────────
function esc(s) {
  return String(s ?? '')
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

// ── Initialise on load ───────────────────────────────────────────────────────
activateTab(INITIAL_TAB, false);
if (INITIAL_TAB !== 'confer') loadTab(INITIAL_TAB);
</script>
<script type="module">
import { ConferVoiceController } from "../static/realtime-voice/realtime-confer-controller.js?v=20261015-token1";
import { RealtimeVoiceController } from "../static/realtime-voice/realtime-voice-controller.js?v=20261015-managed-end1";
import { bindConferDictation, conferVoiceAvailability } from "../static/realtime-voice/confer-input-controls.js?v=20261015-dictation1";
const button=document.getElementById('btn-voice');
const status=document.getElementById('voice-status');
const provider=document.getElementById('voice-provider');
const transcript=document.getElementById('voice-transcript');
let active=false; let activeController=null; let stopping=null; let voiceRestartBlocked=false;
const mode=document.getElementById('voice-mode');
const keepTranscript=document.getElementById('voice-keep-transcript');
const labels={requesting:'Connecting…',listening:'Listening',thinking:'Working on it…',speaking:'Speaking…',reconnecting:'Reconnecting…',interrupted:'Listening'};
const csrfHeaders=cosWriteHeaders;
const controller=new ConferVoiceController({
  requestHeaders:csrfHeaders,
  capabilitiesUrl:'../api/realtime-voice/confer/capabilities',
  bootstrapUrl:'../api/realtime-voice/confer/bootstrap',
  turnUrl:'send',conversationId:'owner',
  onStateChange:(state,info)=>{
    if(['stopped','error'].includes(state)) active=false;
    button.classList.toggle('recording',active);
    button.textContent=active?'■':'🎤';
    button.title=active?'Stop voice conversation':'Start voice conversation';
    button.setAttribute('aria-label',button.title);
    button.setAttribute('aria-pressed',String(active));
    status.textContent=labels[state]||(state==='stopped'?'Stopped':state);
  },
  onProvisionalTranscript:text=>{transcript.textContent=text?`Hearing: ${text}`:'';},
  onUserTurn:text=>appendMsg('user',text),
  onAssistantTurn:text=>appendMsg('cos',text),
  onWarning:()=>{status.textContent='Voice will stop in about two minutes.';},
  onError:error=>{transcript.textContent=`Voice: ${error.detail||error.reason||'could not continue'}. Typing still works.`;},
});
let legacyReady=false;
const realtime=new RealtimeVoiceController({
  managedBootstrap:{sessionUrl:'../api/realtime-voice/managed/session'},requestHeaders:csrfHeaders,
  includeTranscriptAfterEnd:true,
  onStateChange:state=>{
    active=!['idle','ended'].includes(state);
    button.disabled=voiceRestartBlocked||state==='ending';
    button.textContent=active?'■':'🎤';button.classList.toggle('recording',active);
    button.setAttribute('aria-pressed',String(active));
    button.title=active?'End voice conversation':'Start voice conversation';
    button.setAttribute('aria-label',button.title);status.textContent=state;
    if(mode)mode.disabled=active||voiceRestartBlocked;
  },
  // Realtime transcript stays out of the working conversation while speaking;
  // optional export is offered only after End. Native consultations keep their
  // own canonical receipts through the existing Confer service.
  onFatalError:error=>{
    if(['termination_uncertain','voice_session_unresolved','agent_action_unresolved'].includes(error.reason)){voiceRestartBlocked=true;button.disabled=true;if(mode)mode.disabled=true;}
    transcript.textContent=error.detail||'Voice stopped. Typing still works.';
  },
  onWarning:()=>{status.textContent='Voice will stop in about two minutes.';},
  onFinalize:receipt=>{
    if(receipt.partial||!keepTranscript?.checked||!receipt.turns?.length)return;
    const data=receipt.turns.map(t=>`${t.speaker}: ${t.text}${t.completed?'':' [partial]'}`).join('\n\n');
    const url=URL.createObjectURL(new Blob([data],{type:'text/plain;charset=utf-8'}));
    const link=document.createElement('a');link.href=url;link.download='minimoi-voice-transcript.txt';link.click();
    setTimeout(()=>URL.revokeObjectURL(url),0);
  },
});
const dictation=bindConferDictation({
  button:document.getElementById('btn-dictate'),input:document.getElementById('send-input'),
  bootstrapUrl:'../api/realtime-voice/confer/bootstrap',requestHeaders:csrfHeaders,
  beforeStart:async()=>{await stopVoice('dictation_started');if(voiceRestartBlocked)throw new Error('Earlier voice termination needs verification; typing still works');},
  onStatus:text=>{status.textContent=text;},
  onBusy:busy=>{document.getElementById('btn-send').disabled=busy||document.getElementById('send-input').disabled;},
});
function stopVoice(reason){
  if(stopping)return stopping;
  const selected=activeController;
  const pending=(async()=>{
    try{if(selected===realtime)await realtime.endSession(reason);else await controller.stop(reason);}
    finally{active=false;}
  })().finally(()=>{if(stopping===pending)stopping=null;updateVoiceAvailability();});
  stopping=pending;return pending;
}
function updateVoiceAvailability(){
  const availability=conferVoiceAvailability({legacyReady,realtimeReady:Boolean(mode),mode});
  button.disabled=!availability.voiceReady||Boolean(stopping)||voiceRestartBlocked;
  if(mode)mode.disabled=active||Boolean(stopping)||voiceRestartBlocked;
  dictation.setAvailable(availability.dictationReady);
  provider.textContent=availability.voiceReady?'Voice with Chief of Staff':'Voice unavailable · typing still works';
}
updateVoiceAvailability();
async function refreshLegacyAvailability(){
  try {
    const capabilities=await controller.availableProviders();
    legacyReady=(capabilities.providers||[]).some(item=>item.provider==='openai');
  } catch(error) {legacyReady=false;}
  updateVoiceAvailability();
}
button.addEventListener('click',async()=>{
  if(stopping||voiceRestartBlocked)return;
  if(active){await stopVoice('user_ended');return;}
  await dictation.stop('voice_started');
  active=true;
  try {activeController=mode?.value==='realtime'?realtime:controller;
    if(activeController===realtime)await realtime.startSession({provider:'openai',conversation_id:'owner'});
    else await controller.start('openai');}
  catch(error){active=false;transcript.textContent=`Voice could not start: ${error.message}. Typing still works.`;}
});
document.addEventListener('minimoi:companion-opening', event => {
  if (typeof event.detail?.waitUntil !== 'function') return;
  event.detail.waitUntil((async () => {
    await dictation.stop('companion_opened');
    await stopVoice('companion_opened');
    if (voiceRestartBlocked) throw new Error('Earlier voice termination needs verification.');
  })());
});
window.addEventListener('pagehide',()=>{dictation.stop('pagehide');controller.stop('pagehide');realtime.endSession('pagehide');});
void refreshLegacyAvailability();
</script>
</body>
</html>
