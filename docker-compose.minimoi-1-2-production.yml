# OPTIONAL explicit opt-in: MiniMoi 1.2's production settings for CoS, the model routes and the task flow.
# Layered after docker-compose.prod.yml. Present on the host only once switched on, on Robert's word; absent, nothing
# changes. Every secret and state folder must already exist on production: nothing here creates one (no host-path
# creation), and nothing is copied from Dev. The release scripts set the two image values from the tag they just pulled,
# so the companions can't drift from the release. Guildhall has its own two files.
x-new-service: &new-service
  profiles: [minimoi-1-2]
  restart: unless-stopped
  read_only: true
  tmpfs:
    - /tmp:size=32m,mode=1777
  security_opt: [no-new-privileges:true]
  cap_drop: [ALL]

# Apprentice and EA. Their own profile: scripts/deploy.sh and deploy_scoped_release.sh add it only once state/1-2/helpers.on
# exists, which minimoi_1_2_prod_bind.py writes last, after Robert's approval. Own uid, own secrets, no route out.
x-helper: &helper
  <<: *new-service
  profiles: [minimoi-helpers]
  image: ${MINIMOI_COS_SCHEDULER_IMAGE:?immutable reviewed scheduler image digest required}
  networks: [partnership, helpers]
  mem_limit: 192m

x-helper-env: &helper-env
  PARTNERSHIP_TASKS_URL: http://partnership-tasks:8772
  PARTNERSHIP_ENVIRONMENT: prod
  HELPER_TOKEN_FILE: /run/helper/task.token
  HELPER_CHARTER_APPROVALS: /run/helper/charter-approvals.json
  HELPER_STATE_DIR: /state
  GUILD_QUEUE_PATH: /guild/build_queue.json
  HELPER_GATEWAY_URL: http://model-gateway:4000/v1
  HELPER_GATEWAY_KEY_FILE: /run/helper/gateway.key
  HELPER_MODEL: minimoi-xai-low
  PYTHONPATH: /app
  PYTHONDONTWRITEBYTECODE: "1"

services:
  model-gateway:
    environment:
      # One file per month, owned by the gateway (uid 65534, its image's non-root user). Every other writer has its own folder under it.
      MINIMOI_USAGE_DIR: /app/usage-data
      MINIMOI_ENV: prod
    volumes:
      - {type: bind, source: "${MINIMOI_1_2_STATE:?}/usage", target: /app/usage-data, bind: {create_host_path: false}}
    networks:
      - default
      - mc-portal
      - helpers

  cos-bot:
    environment:
      MINIMOI_USAGE_DIR: /app/data/usage
      MINIMOI_USAGE_WRITER: cos-bot
      MINIMOI_ENV: prod
    volumes:
      - {type: bind, source: "${MINIMOI_1_2_STATE:?}/usage", target: /app/data/usage, read_only: true, bind: {create_host_path: false}}
      - {type: bind, source: "${MINIMOI_1_2_STATE:?}/usage/cos-bot", target: /app/data/usage/cos-bot, bind: {create_host_path: false}}

  cos-agent-a:
    environment:
      COS_AGENT_ROLE: cos
      COS_RUNTIME_MODEL_ACCESS: plan
      COS_PLAN_MODEL: openai/gpt-6-astra
      COS_PLAN_ROUTES: openai/gpt-6-sol,openai/gpt-6-luna
      COS_PLAN_AUTH_PROFILE: ${MINIMOI_COS_PLAN_AUTH_PROFILE:?the plan sign-in profile on production required}
      # API tiers a route may switch to: the plan routes' own, and Claude's at the same level for Grok routes (#466).
      COS_FAILOVER_ROUTES: minimoi-gateway/minimoi-openai-strong,minimoi-gateway/minimoi-openai-mid,minimoi-gateway/minimoi-openai-low,minimoi-gateway/minimoi-anthropic-strong,minimoi-gateway/minimoi-anthropic-mid,minimoi-gateway/minimoi-anthropic-low
      # The runtime's default where a turn names no route: Grok, not the plan.
      COS_PRIMARY_ROUTE: minimoi-gateway/minimoi-xai-strong
      # Offered pay-per-use API. Not a default and not a fallback. These and the failover targets use CoS's own capped key,
      # already mounted at /run/cos-key by docker-compose.prod.yml (scripts/operations/cos_prod.sh key). Without it, neither is there.
      COS_METERED_ROUTES: minimoi-gateway/minimoi-xai-strong,minimoi-gateway/minimoi-xai-mid,minimoi-gateway/minimoi-xai-low
      COS_ACTIONS_TOKEN_FILE: /run/secrets/cos-actions-token/token
    volumes:
      - {type: bind, source: "${MINIMOI_1_2_SECRETS:?existing production-only secrets folder required}/cos-bound", target: /run/secrets/cos-bound, read_only: true, bind: {create_host_path: false}}
      - {type: bind, source: "${MINIMOI_1_2_SECRETS:?}/cos-actions-token", target: /run/secrets/cos-actions-token, read_only: true, bind: {create_host_path: false}}

  cos-scheduler:
    environment:
      # Production keeps its background jobs on. Dev's COS_BACKGROUND_JOBS=0 must never come here.
      COS_STORE_ENVIRONMENT: prod
      COS_STORE_DIR: /var/lib/minimoi/cos-store
      COS_TURNS_DIR: /app/data/cos-turns
      COS_VOICE_DIR: /app/data/cos-voice
      COS_OWNER_PRINCIPAL: robert
      COS_OWNER_ASSERTION_ENV: prod
      COS_OWNER_ASSERTION_KEY_FILE: /run/secrets/partnership/cos-owner.key
      COS_OWNER_ASSERTION_NONCE_FILE: /var/lib/minimoi/cos-store/owner-nonces.sqlite3
      # cos_send_to_mc (domains/cos/mc_send.py): off unless .env sets 1; then its one address, MC's internal door.
      MINIMOI_COS_TO_MC: ${MINIMOI_COS_TO_MC:-0}
      COS_TO_MC_URL: http://portal:5011/internal/mc/v1/from-cos
      COS_ACTIONS_TOKEN_FILE: /run/secrets/cos-actions-token/token
      COS_TOOL_BINDINGS_FILE: /var/lib/minimoi/cos-store/tool-bindings.sqlite3
      COS_TOOL_LISTENER_PORT: "8771"
      COS_TOOL_LISTENER_TOKEN_SHA256: ${MINIMOI_COS_TOOL_LISTENER_TOKEN_SHA256:?hash of the bound tool token required}
      COS_BOARD_URL: http://cos-board:5014
      COS_BOARD_PROFILE_FILE: /run/secrets/partnership/board-profile.json
      COS_TASKS_COS_TOKEN_FILE: /run/secrets/partnership/tasks-cos.token
      COS_TASKS_PLATFORM_TOKEN_FILE: /run/secrets/partnership/tasks-platform.token
      MINIMOI_COS_VOICE_DIRECT: "1"
      # Installed above; this admits starts (domains/cos/direct_voice.py). Without it every start is refused in production.
      MINIMOI_COS_DIRECT_VOICE_PRODUCTION: "1"
      VOICE_REALTIME_UI_ENABLED: "1"
      MINIMOI_MODEL_ROUTES_FILE: /run/minimoi-model-routes/catalogue.json
      PARTNERSHIP_ENVIRONMENT: prod
      PARTNERSHIP_TASKS_URL: http://partnership-tasks:8772
      # Her capped voice key, $20: from the mounted cos-partnership folder below, never from .env (minimoi_1_2_prod_bind.py).
      MINIMOI_GATEWAY_KEY_VOICE_SUMMARY_COS_FILE: /run/secrets/partnership/voice-summary-cos.key
      MINIMOI_USAGE_DIR: /app/data/usage
      MINIMOI_USAGE_WRITER: cos-scheduler
      MINIMOI_ENV: prod
    volumes:
      - {type: bind, source: "${MINIMOI_1_2_STATE:?}/usage", target: /app/data/usage, read_only: true, bind: {create_host_path: false}}
      - {type: bind, source: "${MINIMOI_1_2_STATE:?}/usage/cos-scheduler", target: /app/data/usage/cos-scheduler, bind: {create_host_path: false}}
      # The path scripts/backup_local.sh already backs up, under the store's lock.
      - {type: bind, source: /opt/minimoi/cos/store, target: /var/lib/minimoi/cos-store, bind: {create_host_path: false}}
      - {type: bind, source: "${MINIMOI_1_2_STATE:?existing production-only state folder required}/cos-turns", target: /app/data/cos-turns, bind: {create_host_path: false}}
      - {type: bind, source: "${MINIMOI_1_2_STATE:?}/cos-partnership", target: /app/runtime/partnership, bind: {create_host_path: false}}
      - {type: bind, source: "${MINIMOI_1_2_SECRETS:?}/cos-actions-token", target: /run/secrets/cos-actions-token, read_only: true, bind: {create_host_path: false}}
      - {type: bind, source: "${MINIMOI_1_2_SECRETS:?}/cos-partnership", target: /run/secrets/partnership, read_only: true, bind: {create_host_path: false}}
      - {type: bind, source: "${MINIMOI_MODEL_ROUTES_DIR:?production route catalogue folder required}", target: /run/minimoi-model-routes, read_only: true, bind: {create_host_path: false}}
    networks:
      - default
      - vault-internal
      - partnership

  portal:
    environment:
      MINIMOI_COS_WRITE_GUARD: "on"      # off by default on production (app.py); every CoS write is checked
      MC_TURNS_DIR: /app/data/mc-turns
      MINIMOI_GUILD_GITHUB_LOOKUP: "1"
      MINIMOI_MC_GUEST_ACTIONS: "1"
      MINIMOI_MC_GUEST_ACTIONS_ENV: prod
      MINIMOI_MC_VOICE_DIRECT: "1"
      # Installed above; this admits starts (guild_mounts.production_environ). Without it every start is refused in production.
      MINIMOI_GUILD_DIRECT_VOICE_PRODUCTION: "1"
      MINIMOI_MC_VOICED_OUTCOMES: "1"
      VOICE_REALTIME_UI_ENABLED: "1"
      MINIMOI_MODEL_ROUTES_FILE: /run/minimoi-model-routes/catalogue.json
      # The modes are off, record and on; anything else is off, silently. On here, and `notices off` still works: it writes
      # off to .env, and a fixed value in this file would override it.
      MINIMOI_ACTION_NOTICES: ${MINIMOI_ACTION_NOTICES:-on}
      MINIMOI_ACTION_NOTICES_ENV: prod
      PARTNERSHIP_ENVIRONMENT: prod
      PARTNERSHIP_TASKS_URL: http://partnership-tasks:8772
      PARTNERSHIP_MC_TOKEN_FILE: /run/secrets/partnership/mc.token
      # The release's 40-hex commit (MC's task cards name it). The release scripts export it, so it follows every release.
      PARTNERSHIP_CARD_REF: ${MINIMOI_PARTNERSHIP_CARD_REF:?the release commit required}
      # MC's capped voice key, $20: from the mounted portal-partnership folder below, never from .env (minimoi_1_2_prod_bind.py).
      MINIMOI_GATEWAY_KEY_VOICE_SUMMARY_MC_FILE: /run/secrets/partnership/voice-summary-mc.key
      # What Robert sends through CoS (cos_delivery.py): MC's internal door on its tool listener. Off unless .env sets 1.
      MINIMOI_COS_TO_MC: ${MINIMOI_COS_TO_MC:-0}
      PORTAL_COS_OWNER_ENV: prod
      PORTAL_COS_OWNER_KEY_FILE: /run/secrets/partnership/portal-cos-owner.key
      PORTAL_PARTNERSHIP_OWNER_ENV: prod
      PORTAL_PARTNERSHIP_OWNER_KEY_FILE: /run/secrets/partnership/portal-partnership-owner.key
      PORTAL_PARTNERSHIP_PRINCIPAL_TOKEN_FILE: /run/secrets/partnership/principal.token
      # Read here; MC's own stream records go only to usage/portal, mounted read-write below.
      MINIMOI_USAGE_DIR: /app/data/usage
      MINIMOI_ENV: prod
      # The Workshop view reads this folder and never writes it. Nothing feeds it on production yet, so it reads "unknown".
      MINIMOI_WORKSHOPS_DIR: /app/data/workshops
      MINIMOI_WORKSHOP_ID: mac
    volumes:
      - {type: bind, source: "${MINIMOI_1_2_STATE:?}/usage", target: /app/data/usage, read_only: true, bind: {create_host_path: false}}
      - {type: bind, source: "${MINIMOI_1_2_STATE:?}/usage/portal", target: /app/data/usage/portal, bind: {create_host_path: false}}
      - {type: bind, source: "${MINIMOI_1_2_STATE:?}/workshops", target: /app/data/workshops, read_only: true, bind: {create_host_path: false}}
      - {type: bind, source: "${MINIMOI_1_2_STATE:?}/mc-turns", target: /app/data/mc-turns, bind: {create_host_path: false}}
      - {type: bind, source: "${MINIMOI_1_2_SECRETS:?}/portal-partnership", target: /run/secrets/partnership, read_only: true, bind: {create_host_path: false}}
      - {type: bind, source: "${MINIMOI_MODEL_ROUTES_DIR:?}", target: /run/minimoi-model-routes, read_only: true, bind: {create_host_path: false}}
    networks:
      - default
      - iotconnect-edge
      - mc-portal
      - partnership

  cos-board:
    <<: *new-service
    image: ${MINIMOI_PORTAL_IMAGE:?immutable reviewed portal image digest required}
    container_name: minimoi-cos-board
    entrypoint: [python, -m, minimoi_portal.guild_ui.board_headless_runner]
    environment:
      BOARD_API_OWNER: robert
      BOARD_API_BIND: 0.0.0.0
      BOARD_API_PORT: "5014"
      BOARD_API_FLOOR: cos-board
      BOARD_API_PROFILES_FILE: /run/board-secrets/profiles.json
      BOARD_API_CURSOR_KEY_FILE: /run/board-secrets/cursor.key
      # The least-privilege Board database URL, by file: every main service loads /opt/minimoi/.env, so it can't be there.
      DATABASE_URL_FILE: /run/board-secrets/db.url
      MINIMOI_BOARD_ENV: prod
      PYTHONDONTWRITEBYTECODE: "1"
    volumes:
      - {type: bind, source: "${MINIMOI_1_2_SECRETS:?}/cos-board", target: /run/board-secrets, read_only: true, bind: {create_host_path: false}}
    mem_limit: 256m

  partnership-tasks:
    <<: *new-service
    image: ${MINIMOI_COS_SCHEDULER_IMAGE:?immutable reviewed scheduler image digest required}
    container_name: minimoi-partnership-tasks
    command: [python, -m, services.partnership_tasks.http_api]
    environment:
      MINIMOI_ROLE: production
      PARTNERSHIP_PRODUCTION: "1"
      PARTNERSHIP_ENVIRONMENT: prod
      PARTNERSHIP_OWNER_ENV: prod
      # Exactly owner:robert, the form the portal signs. minimoi_1_2_prod_bind.py writes it, and refuses any other value.
      PARTNERSHIP_OWNER_SUBJECT: ${MINIMOI_PARTNERSHIP_OWNER_SUBJECT:?production owner subject required}
      PARTNERSHIP_PORT: "8772"
      PARTNERSHIP_ROOT: /data/store
      PARTNERSHIP_HOST: 0.0.0.0
      PARTNERSHIP_BINDINGS: /run/secrets/partnership/bindings.json
      PARTNERSHIP_GRANTS: /run/secrets/partnership/grants.json
      PARTNERSHIP_OWNER_KEY_FILE: /run/secrets/partnership/owner.key
      PARTNERSHIP_OWNER_NONCE_FILE: /data/owner-nonces.sqlite3
      PYTHONPATH: /app
    volumes:
      - {type: bind, source: "${MINIMOI_1_2_STATE:?}/partnership", target: /data, bind: {create_host_path: false}}
      - {type: bind, source: "${MINIMOI_1_2_SECRETS:?}/partnership", target: /run/secrets/partnership, read_only: true, bind: {create_host_path: false}}
    networks: [partnership]
    mem_limit: 256m

  partnership-worker:
    <<: *new-service
    image: ${MINIMOI_COS_SCHEDULER_IMAGE:?}
    container_name: minimoi-partnership-worker
    command: [python, -m, services.partnership_tasks.worker]
    environment:
      PARTNERSHIP_ENVIRONMENT: prod
      PARTNERSHIP_TASKS_URL: http://partnership-tasks:8772
      PARTNERSHIP_DRAINER_TOKEN_FILE: /run/secrets/partnership/drainer.token
      PARTNERSHIP_RUNNER_SEATS_FILE: /run/secrets/partnership/runner-seats.json
      DATABASE_URL_FILE: /run/secrets/partnership/db.url
      MINIMOI_MC_DELEGATION_ENV: prod
      MINIMOI_MC_DELEGATION_PRINCIPAL: robert
      MINIMOI_MC_DELEGATION_AUTHORITY_FILE: /app/core/mc_delegation_dispatcher/authority.prod.json
      PARTNERSHIP_NOTICES_URL: http://portal:5001
      PARTNERSHIP_NOTICES_TOKEN_FILE: /run/secrets/partnership/notices.token
      PARTNERSHIP_WORKER_LOCK: /data/worker.lock
      PYTHONPATH: /app
    volumes:
      - {type: bind, source: "${MINIMOI_1_2_STATE:?}/partnership", target: /data, bind: {create_host_path: false}}
      - {type: bind, source: "${MINIMOI_1_2_SECRETS:?}/partnership", target: /run/secrets/partnership, read_only: true, bind: {create_host_path: false}}
    networks: [partnership, default]
    mem_limit: 192m

  helper-apprentice:
    <<: *helper
    container_name: minimoi-helper-apprentice
    user: "2101:2101"
    command: [python, -m, services.helper_seats.worker, --seat, apprentice]
    environment:
      <<: *helper-env
      HELPER_REPO_ROOT: /repo
    volumes:
      - {type: bind, source: "${MINIMOI_1_2_SECRETS:?}/helper-apprentice", target: /run/helper, read_only: true, bind: {create_host_path: false}}
      - {type: bind, source: "${MINIMOI_1_2_STATE:?}/helper-apprentice", target: /state, bind: {create_host_path: false}}
      - {type: bind, source: "${MINIMOI_ROOT:-/opt/minimoi}/mc/repo", target: /repo, read_only: true, bind: {create_host_path: false}}
      # The folder, not the file: the portal replaces the file on each save, and a file mount would keep reading the old one.
      - {type: bind, source: "${MINIMOI_ROOT:-/opt/minimoi}/data/guild", target: /guild, read_only: true, bind: {create_host_path: false}}

  helper-ea:
    <<: *helper
    container_name: minimoi-helper-ea
    user: "2102:2102"
    command: [python, -m, services.helper_seats.worker, --seat, ea]
    environment:
      <<: *helper-env
    volumes:
      - {type: bind, source: "${MINIMOI_1_2_SECRETS:?}/helper-ea", target: /run/helper, read_only: true, bind: {create_host_path: false}}
      - {type: bind, source: "${MINIMOI_1_2_STATE:?}/helper-ea", target: /state, bind: {create_host_path: false}}
      - {type: bind, source: "${MINIMOI_ROOT:-/opt/minimoi}/data/guild", target: /guild, read_only: true, bind: {create_host_path: false}}

networks:
  partnership:
    name: minimoi-partnership
    internal: true
  # The helpers and the model gateway only. Internal, so a helper has no route out.
  helpers:
    name: minimoi-helpers
    internal: true
