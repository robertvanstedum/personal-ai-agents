# Prometheus (spec 161 §10.4): evaluates rules/*.yaml against the Collector's metrics and sends
# alerts to Alertmanager. Run flags (compose): --storage.tsdb.retention.time=15d
# --storage.tsdb.retention.size=2GB --web.enable-lifecycle (reload on the private network only).
global:
  scrape_interval: 30s
  evaluation_interval: 30s
  external_labels: {minimoi_environment: '${MINIMOI_ENV}'}
rule_files: [/etc/prometheus/rules/*.yaml]
alerting:
  alertmanagers: [{static_configs: [{targets: ['alertmanager:9093']}]}]
scrape_configs:
- job_name: otel-collector
  sample_limit: 2000          # series cap (spec 161 P8); excess drops and ScrapeLimitHit alerts
  label_limit: 12
  static_configs: [{targets: ['otel-collector:8889']}]
- job_name: otel-collector-self
  static_configs: [{targets: ['otel-collector:8888']}]
- job_name: prometheus
  static_configs: [{targets: ['localhost:9090']}]
- job_name: alertmanager
  static_configs: [{targets: ['alertmanager:9093']}]
