# Production docker-compose — EC2 deployment
# Uses one immutable ECR commit tag per release. CI exports MINIMOI_IMAGE_TAG;
# manual use defaults to latest unless scripts/deploy.sh receives a tag.
# Data files must exist under /opt/minimoi/data/ on the host.
# Run: docker-compose -f docker-compose.prod.yml up -d
# Update images: scripts/deploy.sh

services:
  postgres:
    image: postgres:latest
    container_name: postgres-ai-agents
    restart: unless-stopped
    env_file: /opt/minimoi/.env
    environment:
      - POSTGRES_DB=personal_agents
    volumes:
      - postgres-data:/var/lib/postgresql
    ports:
      - "127.0.0.1:5432:5432"

  model-gateway:
    image: 332704997792.dkr.ecr.us-east-1.amazonaws.com/minimoi/cos-scheduler:model-gateway-${MINIMOI_IMAGE_TAG:-latest}
    container_name: minimoi-model-gateway
    restart: unless-stopped
    command:
      - --config
      - /app/config.yaml
      - --port
      - "4000"
      - --num_workers
      - "1"
    environment:
      - LITELLM_MASTER_KEY=${MINIMOI_MODEL_GATEWAY_KEY:?set MINIMOI_MODEL_GATEWAY_KEY in /opt/minimoi/.env}
      - XAI_API_KEY=${XAI_API_KEY:?set XAI_API_KEY in /opt/minimoi/.env}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:?set ANTHROPIC_API_KEY in /opt/minimoi/.env}
      - MINIMOI_RECEIPT_ENDPOINT=http://cos-scheduler:8769/internal/model-gateway/receipt
      - MINIMOI_RECEIPT_KEY=${MINIMOI_MODEL_GATEWAY_RECEIPT_KEY:?set MINIMOI_MODEL_GATEWAY_RECEIPT_KEY in /opt/minimoi/.env}
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:4000/health/liveliness', timeout=3)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  cos-agent-a:
    image: 332704997792.dkr.ecr.us-east-1.amazonaws.com/minimoi/cos-scheduler:agent-a-${MINIMOI_IMAGE_TAG:-latest}
    container_name: minimoi-cos-agent-a
    restart: unless-stopped
    environment:
      - OPENCLAW_GATEWAY_TOKEN=${COS_AGENT_A_GATEWAY_TOKEN:?set COS_AGENT_A_GATEWAY_TOKEN in /opt/minimoi/.env}
      - MINIMOI_MODEL_GATEWAY_KEY=${MINIMOI_MODEL_GATEWAY_KEY:?set MINIMOI_MODEL_GATEWAY_KEY in /opt/minimoi/.env}
      - OPENCLAW_STATE_DIR=/home/node/.openclaw
      - OPENCLAW_CONFIG_PATH=/home/node/.openclaw/openclaw.json
      - OPENCLAW_DISABLE_BONJOUR=1
      - TZ=${COS_AGENT_TIMEZONE:-America/Chicago}
    volumes:
      - cos-agent-a-state:/home/node/.openclaw
      - cos-agent-a-auth:/home/node/.config/openclaw
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    depends_on:
      model-gateway:
        condition: service_healthy

  curator:
    image: 332704997792.dkr.ecr.us-east-1.amazonaws.com/minimoi/curator:${MINIMOI_IMAGE_TAG:-latest}
    container_name: minimoi-curator
    restart: unless-stopped
    env_file: /opt/minimoi/.env
    environment:
      - FLASK_ENV=production
      - PORT=8766
    volumes:
      # curator_signals.json, curator_latest.json, curator_radar.json now live
      # inside this same mounted directory (data/curator/curator_*.json) rather
      # than as separate top-level mounts -- see Phase 2 Slice 5. REQUIRES the
      # EC2 host files to be moved from /opt/minimoi/data/curator_*.json into
      # /opt/minimoi/data/curator/curator_*.json before this deploys, or the
      # container will find no data at startup.
      - /opt/minimoi/data/curator:/app/data/curator
      - /opt/minimoi/data/curator_archive:/app/curator_archive
      - /opt/minimoi/data/curator_history.json:/app/curator_history.json
      - /opt/minimoi/data/curator_costs.json:/app/curator_costs.json
      - /opt/minimoi/data/interests:/app/interests
      - /opt/minimoi/data/research-intelligence:/app/_NewDomains/research-intelligence/data
    ports:
      - "127.0.0.1:8766:8766"
    depends_on:
      - postgres

  german:
    image: 332704997792.dkr.ecr.us-east-1.amazonaws.com/minimoi/mein-deutsch:${MINIMOI_IMAGE_TAG:-latest}
    container_name: minimoi-german
    restart: unless-stopped
    env_file: /opt/minimoi/.env
    environment:
      - FLASK_ENV=production
      - MINIMOI_ROLE=production
      - PORT=8767
      # Realtime voice is the released default. Set to 0 in /opt/minimoi/.env
      # only for an explicit rollback to the older session UI.
      - VOICE_REALTIME_UI_ENABLED=${VOICE_REALTIME_UI_ENABLED:-1}
    volumes:
      - /opt/minimoi/data/german:/app/domains/german/data
    ports:
      - "127.0.0.1:8767:8767"

  portuguese:
    image: 332704997792.dkr.ecr.us-east-1.amazonaws.com/minimoi/portuguese:${MINIMOI_IMAGE_TAG:-latest}
    container_name: minimoi-portuguese
    restart: unless-stopped
    env_file: /opt/minimoi/.env
    environment:
      - FLASK_ENV=production
      - MINIMOI_ROLE=production
      - PORT=8770
      # Keep Portuguese on the same shared voice layer and release state.
      - VOICE_REALTIME_UI_ENABLED=${VOICE_REALTIME_UI_ENABLED:-1}
    volumes:
      - /opt/minimoi/data/portuguese:/app/domains/portuguese/data
    ports:
      - "127.0.0.1:8770:8770"
    depends_on:
      - postgres

  portal:
    image: 332704997792.dkr.ecr.us-east-1.amazonaws.com/minimoi/portal:${MINIMOI_IMAGE_TAG:-latest}
    container_name: minimoi-portal
    restart: unless-stopped
    env_file: /opt/minimoi/.env
    environment:
      - FLASK_ENV=production
      - PORT=5001
      - COS_BACKEND=http://cos-scheduler:8769
      - CONNECTHQ_BACKEND=http://connecthq:8095
    volumes:
      - /opt/minimoi/data/guild/build_queue.json:/app/data/guild/build_queue.json
      - /opt/minimoi/docs/design:/app/docs/design
      - /opt/minimoi/docs/specs:/app/docs/specs
      - /opt/minimoi/auth/users.json:/app/minimoi_portal/auth/users.json
      - /opt/minimoi/auth/guests.json:/app/minimoi_portal/auth/guests.json
      - /opt/minimoi/agent_logs:/app/agent_logs
    ports:
      - "127.0.0.1:5001:5001"
    depends_on:
      - curator
      - german
      - portuguese
      - postgres
      - cos-scheduler

  system-bot:
    image: 332704997792.dkr.ecr.us-east-1.amazonaws.com/minimoi/system-bot:${MINIMOI_IMAGE_TAG:-latest}
    container_name: minimoi-system-bot
    restart: unless-stopped
    env_file: /opt/minimoi/.env
    environment:
      - MINIMOI_ROLE=production
      - TELEGRAM_CHAT_ID=8379221702
    # Shares the German data volume with the web container so drills, phrasebook,
    # progress and session files are the same store the Gespräche UI reads/writes.
    volumes:
      - /opt/minimoi/data/german:/app/domains/german/data
    depends_on:
      - curator
      - portal
      - german

  cos-bot:
    image: 332704997792.dkr.ecr.us-east-1.amazonaws.com/minimoi/cos-bot:${MINIMOI_IMAGE_TAG:-latest}
    container_name: minimoi-cos-bot
    restart: unless-stopped
    env_file: /opt/minimoi/.env
    environment:
      - MINIMOI_ROLE=production
      - COS_BACKEND_TYPE=${COS_BACKEND_TYPE:-openclaw}
      - COS_AGENT_RUNTIME_URL=http://cos-agent-a:18789/v1
      - COS_AGENT_RUNTIME_TOKEN=${COS_AGENT_A_GATEWAY_TOKEN:?set COS_AGENT_A_GATEWAY_TOKEN in /opt/minimoi/.env}
      - COS_AGENT_RUNTIME_AGENT_ID=${COS_AGENT_RUNTIME_AGENT_ID:-cos-agent-a}
      - COS_AGENT_TIMEZONE=${COS_AGENT_TIMEZONE:-America/Chicago}
      - COS_MODEL_GATEWAY_RECEIPT_KEY=${MINIMOI_MODEL_GATEWAY_RECEIPT_KEY:?set MINIMOI_MODEL_GATEWAY_RECEIPT_KEY in /opt/minimoi/.env}
    volumes:
      - /opt/minimoi/cos_memory.md:/app/data/cos_memory.md
      - /opt/minimoi/data/model_gateway_receipts.jsonl:/app/data/model_gateway_receipts.jsonl
      - /opt/minimoi/data/guild/cos_context.json:/app/domains/guild/config/cos_context.json
    depends_on:
      - postgres
      - cos-scheduler
      - cos-agent-a

  cos-scheduler:
    image: 332704997792.dkr.ecr.us-east-1.amazonaws.com/minimoi/cos-scheduler:${MINIMOI_IMAGE_TAG:-latest}
    container_name: minimoi-cos-scheduler
    restart: unless-stopped
    env_file: /opt/minimoi/.env
    environment:
      - MINIMOI_ROLE=production
      - TELEGRAM_CHAT_ID=8379221702
      - PORT=8769
      - DISABLE_TELEGRAM_POLL=1
      - COS_BACKEND_TYPE=${COS_BACKEND_TYPE:-openclaw}
      - COS_AGENT_RUNTIME_URL=http://cos-agent-a:18789/v1
      - COS_AGENT_RUNTIME_TOKEN=${COS_AGENT_A_GATEWAY_TOKEN:?set COS_AGENT_A_GATEWAY_TOKEN in /opt/minimoi/.env}
      - COS_AGENT_RUNTIME_AGENT_ID=${COS_AGENT_RUNTIME_AGENT_ID:-cos-agent-a}
      - COS_AGENT_TIMEZONE=${COS_AGENT_TIMEZONE:-America/Chicago}
      - COS_MODEL_GATEWAY_RECEIPT_KEY=${MINIMOI_MODEL_GATEWAY_RECEIPT_KEY:?set MINIMOI_MODEL_GATEWAY_RECEIPT_KEY in /opt/minimoi/.env}
    volumes:
      - /opt/minimoi/cos_memory.md:/app/data/cos_memory.md
      - /opt/minimoi/data/model_gateway_receipts.jsonl:/app/data/model_gateway_receipts.jsonl
      - /opt/minimoi/data/guild/cos_context.json:/app/domains/guild/config/cos_context.json
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      - "127.0.0.1:8769:8769"
    depends_on:
      - postgres
      - cos-agent-a

  # ── Connect HQ standalone IoT demo (frozen tag, profile-gated) ─────────────
  # Source: prototype-lab/projects/project-connect-hq. Deployed only by
  # .github/workflows/deploy-connecthq.yml on a `connecthq-v*` tag. The
  # `connecthq` profile keeps these services out of the ordinary main deploy so
  # a routine push never rebuilds, moves, or pulls the demo. CONNECTHQ_IMAGE_TAG
  # defaults to the frozen beta tag; only the Connect HQ workflow overrides it.
  connecthq-postgres:
    image: postgres:16-alpine
    container_name: minimoi-connecthq-postgres
    profiles: ["connecthq"]
    restart: unless-stopped
    environment:
      - POSTGRES_DB=connecthq
      - POSTGRES_USER=connecthq_app
      - POSTGRES_PASSWORD=${CONNECTHQ_DB_PASSWORD:?set CONNECTHQ_DB_PASSWORD in /opt/minimoi/.env (SSM /minimoi/production/connecthq_db_password)}
    volumes:
      - connecthq-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U connecthq_app -d connecthq"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 5s

  connecthq-integrations:
    image: 332704997792.dkr.ecr.us-east-1.amazonaws.com/minimoi/connecthq:${CONNECTHQ_IMAGE_TAG:-connecthq-v0.9.0-beta.1}
    container_name: minimoi-connecthq-integrations
    profiles: ["connecthq"]
    restart: unless-stopped
    command: ["uvicorn", "integration_stubs.main:app", "--host", "0.0.0.0", "--port", "8096"]
    # Internal only: the app reaches it on the compose network; never published.
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8096/mock/flowone/v1/health', timeout=3).status == 200 else 1)"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s

  connecthq:
    image: 332704997792.dkr.ecr.us-east-1.amazonaws.com/minimoi/connecthq:${CONNECTHQ_IMAGE_TAG:-connecthq-v0.9.0-beta.1}
    container_name: minimoi-connecthq
    profiles: ["connecthq"]
    restart: unless-stopped
    environment:
      - WHAM_V3_STORE=postgres
      - POSTGRES_DSN=postgresql://connecthq_app:${CONNECTHQ_DB_PASSWORD:?set CONNECTHQ_DB_PASSWORD in /opt/minimoi/.env}@connecthq-postgres:5432/connecthq
      - FLOWONE_BASE_URL=http://connecthq-integrations:8096
      - AMDOCS_MIDDLEWARE_BASE_URL=http://connecthq-integrations:8096
      - CONNECTHQ_INTEGRATIONS_URL=http://connecthq-integrations:8096
      - CONNECTHQ_APP_URL=http://127.0.0.1:8095
      - CONNECTHQ_SEED_TIMESTAMP=${CONNECTHQ_SEED_TIMESTAMP:-2026-08-01T00:00:00+00:00}
      - CONNECTHQ_ROOT_PATH=/app/connecthq
    ports:
      - "127.0.0.1:8095:8095"
    depends_on:
      connecthq-postgres:
        condition: service_healthy
      connecthq-integrations:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8095/api/v1/health', timeout=3).status == 200 else 1)"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

volumes:
  postgres-data:
  cos-agent-a-state:
  cos-agent-a-auth:
  connecthq-postgres-data:
