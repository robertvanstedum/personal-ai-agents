name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

# One production deploy at a time (incident 12 Nov 2026, 03:28-03:39 UTC): three merges in a minute started three runs,
# their compose ups on EC2 collided, and the portal, CoS and the language domains sat in "Created" beside renamed stray
# containers until the last run was re-run alone. Later pushes queue; none is cancelled mid-deploy.
concurrency:
  group: production-deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  classify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read        # to find the last push that deployed successfully (see "Classify release contents")
    outputs:
      release_class: ${{ steps.changes.outputs.release_class }}
      services: ${{ steps.changes.outputs.services }}
      test_scope: ${{ steps.changes.outputs.test_scope }}
      test_targets: ${{ steps.changes.outputs.test_targets }}
      # The stacks this release refreshes (#550): main (the services above), guildhall (Records and its two workers; see
      # classify_release.guildhall), and whether the workers' image must be built for it.
      stacks: ${{ steps.changes.outputs.stacks }}
      guildhall: ${{ steps.changes.outputs.guildhall }}
      guildhall_reasons: ${{ steps.changes.outputs.guildhall_reasons }}
      rooms_worker_image: ${{ steps.changes.outputs.rooms_worker_image }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # PyYAML reads docker-compose.prod.yml per service; without it the
      # classifier falls back to a full release.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install classifier dependencies
        run: pip install 'PyYAML>=6.0.1'

      - name: Classify release contents
        id: changes
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Manual runs are explicit application deployments. A normal push
          # can take the lightweight document-release path when every changed
          # file is documentation, generated documentation, or the release
          # plumbing/tests that govern that path.
          ALL_SERVICES="portal curator german portuguese system-bot cos-bot cos-scheduler cos-agent-a model-gateway"
          # A full release moves the portal, so Records follows it; the workers keep their image unless their files changed.
          FULL_STACKS=$'stacks=main guildhall\nguildhall=true\nrooms_worker_image=false\nguildhall_reasons=full release (new portal image)'
          # A full release runs the whole test suite; select_tests.py says so too.
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "release_class=full" >> "$GITHUB_OUTPUT"
            echo "services=$ALL_SERVICES" >> "$GITHUB_OUTPUT"
            echo "test_scope=full" >> "$GITHUB_OUTPUT"
            echo "$FULL_STACKS" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # PRs compare cumulative changes against their target merge-base;
          # pushes use before when available, with conservative fallbacks.
          # Exit 3: no trusted PR base or rewritten main history; classify all.
          # A push compares against the last push to main that deployed successfully, not just the previous push:
          # with one deploy at a time, a queued run can be replaced by a newer one, and the newer one must restart the
          # services of every change since the last good deploy (12 Nov 2026: #516's run was replaced by #512's).
          PUSH_BEFORE="${{ github.event.before }}"
          if [ "${{ github.event_name }}" = "push" ]; then
            # Only a run whose deploy job succeeded counts: a tests-only or docs-only run succeeds without deploying.
            LAST=""
            for RUN in $(gh api "repos/${{ github.repository }}/actions/workflows/deploy.yml/runs?branch=main&event=push&status=success&per_page=20" \
                -q '.workflow_runs[] | "\(.id):\(.head_sha)"' 2>/dev/null || true); do
              DEPLOY=$(gh api "repos/${{ github.repository }}/actions/runs/${RUN%%:*}/jobs" -q '.jobs[] | select(.name == "deploy") | .conclusion' 2>/dev/null || true)
              if [ "$DEPLOY" = "success" ]; then LAST="${RUN#*:}"; break; fi
            done
            if [ -n "$LAST" ] && git merge-base --is-ancestor "$LAST" "${{ github.sha }}" 2>/dev/null && [ "$LAST" != "${{ github.sha }}" ]; then
              echo "release base: last successful deploy $LAST (event before was $PUSH_BEFORE)"
              PUSH_BEFORE="$LAST"
            fi
          fi
          rc=0
          BEFORE=$(bash scripts/ci/release_base.sh "$PUSH_BEFORE" "${{ github.sha }}" "${{ github.base_ref }}") || rc=$?
          if [ "$rc" = 3 ]; then
            echo "release_class=full" >> "$GITHUB_OUTPUT"
            echo "services=$ALL_SERVICES" >> "$GITHUB_OUTPUT"
            echo "test_scope=full" >> "$GITHUB_OUTPUT"
            echo "$FULL_STACKS" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          [ "$rc" = 0 ] || exit "$rc"

          # --base lets a docker-compose.prod.yml change restart only the
          # services whose own block changed (classify_release.py).
          CHANGED="$RUNNER_TEMP/changed_paths.txt"
          git diff --name-only "$BEFORE" "${{ github.sha }}" > "$CHANGED"
          RELEASE_CLASS=$(python3 scripts/ci/classify_release.py --base "$BEFORE" --head "${{ github.sha }}" \
            --github-output "$GITHUB_OUTPUT" < "$CHANGED" |
            python3 -c 'import json, sys; print(json.load(sys.stdin)["release_class"])')
          python3 scripts/ci/select_tests.py --release-class "$RELEASE_CLASS" --event "${{ github.event_name }}" \
            --github-output "$GITHUB_OUTPUT" < "$CHANGED"

  test:
    needs: classify
    runs-on: ubuntu-latest
    # A release waits on this job: past 15 minutes it fails rather than holds the deploy.
    timeout-minutes: 15
    # A throwaway PostgreSQL for the opt-in database tests (MC_BINDING_TEST_DSN):
    # trust auth, synthetic data only, gone when the job ends. It is the image
    # production runs (docker-compose.prod.yml). Without it those tests skip.
    services:
      postgres:
        image: postgres:latest
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: mc12_test_ci
        ports:
          - 5432:5432
        # Over TCP: during first-start setup the server listens on its socket only.
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U postgres -d mc12_test_ci"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Some tests need 5 GB free (their own reserves), and a hosted runner sometimes has less: 2 of 3 runs failed that way, 7 Nov.
      - name: Free runner disk
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Install test dependencies
        run: |
          pip install -r requirements.test.txt
          pip install -r scripts/docs/requirements.txt

      - name: Verify maintained document PDFs are current
        run: python3 scripts/docs/publish_key_docs.py --check

      # A focused set for a domain or document release (scripts/ci/select_tests.py);
      # the whole suite for a full release, a manual run, or any doubt. Anything
      # other than "focused" runs the whole suite. The whole suite also runs
      # nightly on main (nightly-tests.yml). The database tests run whenever
      # their files are in the set.
      - name: Run regression tests
        env:
          TEST_SCOPE: ${{ needs.classify.outputs.test_scope }}
          TEST_TARGETS: ${{ needs.classify.outputs.test_targets }}
          MC_BINDING_TEST_DSN: host=127.0.0.1 port=5432 dbname=mc12_test_ci user=postgres
        run: |
          if [ "$TEST_SCOPE" = "focused" ] && [ -n "$TEST_TARGETS" ]; then
            echo "Focused tests: $TEST_TARGETS"
            # shellcheck disable=SC2086 # the targets are space-separated repository paths
            pytest $TEST_TARGETS -q -x --junit-xml=data/reports/junit.xml --ignore=tests/smoke
          else
            # A quick sanity set before a full release: the always-run core (the release and deploy guards). The whole
            # suite runs nightly on main (nightly-tests.yml) and files an issue for anything it finds; the owner tests
            # further in production. Keeps merge-to-live near ten minutes.
            CORE=$(python3 -c "import os,sys; sys.path.insert(0, 'scripts/ci'); import select_tests as s; print(' '.join(t for t in s.CORE_TESTS if os.path.isfile(t)))")
            echo "Sanity tests: $CORE"
            # shellcheck disable=SC2086 # space-separated repository paths
            pytest $CORE -q -x --junit-xml=data/reports/junit.xml --ignore=tests/smoke
          fi

      - name: Check docs/specs naming/duplicates/supersession
        if: always()
        run: python3 scripts/check_spec_format.py

      - name: Upload test report
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: data/reports/junit.xml
        if: always()

      - name: File GitHub issues for failures
        if: failure()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHA: ${{ github.sha }}
          BRANCH: ${{ github.ref_name }}
        run: |
          pip install requests -q
          python3 scripts/file_defect.py \
            --junit data/reports/junit.xml \
            --sha $SHA \
            --branch $BRANCH

  build-push:
    # Builds while the tests run; deploy waits for both.
    needs: [classify]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && needs.classify.outputs.release_class != 'documents'
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.tag.outputs.sha }}
    steps:
      - uses: actions/checkout@v4

      - name: Set image tag
        id: tag
        run: echo "sha=${GITHUB_SHA::7}" >> $GITHUB_OUTPUT

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push selected images
        run: |
          SHA=${{ steps.tag.outputs.sha }}
          REGISTRY=332704997792.dkr.ecr.us-east-1.amazonaws.com
          for service in ${{ needs.classify.outputs.services }}; do
            case "$service" in
              portal) dockerfile="docker/Dockerfile.portal"; repository="portal"; tag="$SHA" ;;
              curator) dockerfile="docker/Dockerfile.curator"; repository="curator"; tag="$SHA" ;;
              german) dockerfile="docker/Dockerfile.german"; repository="mein-deutsch"; tag="$SHA" ;;
              portuguese) dockerfile="docker/Dockerfile.portuguese"; repository="portuguese"; tag="$SHA" ;;
              system-bot) dockerfile="docker/Dockerfile.telegram"; repository="system-bot"; tag="$SHA" ;;
              cos-bot) dockerfile="docker/Dockerfile.cos-bot"; repository="cos-bot"; tag="$SHA" ;;
              cos-scheduler) dockerfile="docker/Dockerfile.cos-scheduler"; repository="cos-scheduler"; tag="$SHA" ;;
              cos-agent-a) dockerfile="docker/Dockerfile.cos-agent-a"; repository="cos-scheduler"; tag="agent-a-$SHA" ;;
              model-gateway) dockerfile="docker/Dockerfile.model-gateway"; repository="cos-scheduler"; tag="model-gateway-$SHA" ;;
              *) echo "Unknown service $service"; exit 1 ;;
            esac
            latest_tag="latest"
            [[ "$tag" == agent-a-* ]] && latest_tag="agent-a-latest"
            [[ "$tag" == model-gateway-* ]] && latest_tag="model-gateway-latest"
            echo "Building $service from $dockerfile as minimoi/$repository:$tag"
            docker build \
              -f "$dockerfile" \
              -t "$REGISTRY/minimoi/$repository:$tag" \
              -t "$REGISTRY/minimoi/$repository:$latest_tag" \
              .
            docker push "$REGISTRY/minimoi/$repository:$tag"
            docker push "$REGISTRY/minimoi/$repository:$latest_tag"
          done

  # Guildhall's workers run their own image (#550): built here when a release changes its files, instead of by a manual
  # dispatch. The same workflow a person can still dispatch by hand; the deploy job hands its digest to the refresh.
  build-worker:
    needs: [classify]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && needs.classify.outputs.rooms_worker_image == 'true'
    uses: ./.github/workflows/rooms-worker-image.yml
    with:
      commit: ${{ github.sha }}
    secrets: inherit

  deploy:
    needs: [classify, test, build-push, build-worker]
    # build-worker is skipped on most releases; a skipped need would otherwise skip this job, so each result is named.
    if: >-
      !cancelled() && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
      && needs.classify.result == 'success' && needs.test.result == 'success' && needs.build-push.result == 'success'
      && (needs.build-worker.result == 'success' || needs.build-worker.result == 'skipped')
    runs-on: ubuntu-latest
    env:
      EC2_INSTANCE_ID: ${{ secrets.EC2_INSTANCE_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Sync docs/specs and design docs to EC2
        run: ./scripts/sync_docs.sh

      - name: Push docker-compose.prod.yml to EC2
        run: |
          # The compose file travels gzipped: as plain base64 this command reached AWS's 97 KB SSM limit (26 Oct
          # 2026, MaxDocumentSizeExceeded). Keep new files out of this command; give them their own step.
          COMPOSE=$(gzip -9 -c docker-compose.prod.yml | base64 -w 0)
          LESEN_CRON=$(base64 -w 0 scripts/operations/install_lesen_refresh_cron.sh)
          CURATOR_CRON=$(base64 -w 0 scripts/run_curator_cron_ec2.sh)
          INTELLIGENCE_CRON=$(base64 -w 0 scripts/run_intelligence_cron_ec2.sh)
          CURATOR_CRON_SETUP=$(base64 -w 0 scripts/setup_ec2_cron.sh)
          COS_SECRET_SYNC=$(base64 -w 0 scripts/credentials/sync_cos_runtime_secrets_from_ssm.sh)
          SCOPED_DEPLOY=$(base64 -w 0 scripts/operations/deploy_scoped_release.sh)
          RELEASE_STATUS=$(base64 -w 0 scripts/operations/release_status.py)
          RELEASE_MANIFEST=$(python3 scripts/operations/release_status.py manifest | base64 -w 0)
          SEED_QUEUE=$(base64 -w 0 scripts/operations/seed_build_queue.sh)
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids ${{ secrets.EC2_INSTANCE_ID }} \
            --document-name "AWS-RunShellScript" \
            --parameters "commands=[\"mkdir -p /opt/minimoi/scripts\",\"echo $COMPOSE | base64 -d | gunzip > /opt/minimoi/docker-compose.prod.yml\",\"echo $CURATOR_CRON | base64 -d > /opt/minimoi/scripts/run_curator_cron_ec2.sh\",\"echo $INTELLIGENCE_CRON | base64 -d > /opt/minimoi/scripts/run_intelligence_cron_ec2.sh\",\"echo $CURATOR_CRON_SETUP | base64 -d > /opt/minimoi/scripts/setup_ec2_cron.sh\",\"echo $COS_SECRET_SYNC | base64 -d > /opt/minimoi/scripts/sync_cos_runtime_secrets_from_ssm.sh\",\"echo $LESEN_CRON | base64 -d > /opt/minimoi/scripts/install_lesen_refresh_cron.sh\",\"echo $SCOPED_DEPLOY | base64 -d > /opt/minimoi/scripts/deploy_scoped_release.sh\",\"echo $RELEASE_STATUS | base64 -d > /opt/minimoi/scripts/release_status.py\",\"echo $RELEASE_MANIFEST | base64 -d | python3 /opt/minimoi/scripts/release_status.py install-manifest\",\"echo $SEED_QUEUE | base64 -d > /opt/minimoi/scripts/seed_build_queue.sh\",\"chmod +x /opt/minimoi/scripts/install_lesen_refresh_cron.sh /opt/minimoi/scripts/run_curator_cron_ec2.sh /opt/minimoi/scripts/run_intelligence_cron_ec2.sh /opt/minimoi/scripts/setup_ec2_cron.sh /opt/minimoi/scripts/sync_cos_runtime_secrets_from_ssm.sh /opt/minimoi/scripts/deploy_scoped_release.sh /opt/minimoi/scripts/seed_build_queue.sh\"]" \
            --query 'Command.CommandId' \
            --output text)

          echo "Compose sync command ID: $COMMAND_ID"
          for i in $(seq 1 60); do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id ${{ secrets.EC2_INSTANCE_ID }} \
              --query 'Status' --output text 2>/dev/null || echo "Pending")
            echo "[$i/60] Compose sync status: $STATUS"
            if [ "$STATUS" = "Success" ]; then break; fi
            if [ "$STATUS" = "Failed" ] || [ "$STATUS" = "Cancelled" ] || [ "$STATUS" = "TimedOut" ]; then
              echo "Compose sync FAILED with status: $STATUS"
              aws ssm get-command-invocation \
                --command-id "$COMMAND_ID" \
                --instance-id ${{ secrets.EC2_INSTANCE_ID }} \
                --query 'StandardErrorContent' --output text 2>/dev/null || true
              exit 1
            fi
            sleep 5
          done

          if [ "$STATUS" != "Success" ]; then
            echo "Compose sync timed out after 5 minutes"
            exit 1
          fi

          echo "Compose sync confirmed successful on EC2"

      # Its own SSM command: the compose sync above is already near the
      # command size limit. deploy_scoped_release.sh needs these before it
      # replaces Curator (#305). Also installs the read-only activation parser;
      # the host-owned /etc/minimoi configuration is never uploaded or replaced.
      - name: Push Curator preservation kit to EC2
        run: |
          MANUAL_DEPLOY=$(base64 -w 0 scripts/deploy.sh)
          CURATOR_STATE_KIT=$(tar -czf - -C scripts/operations production_activation.py curator_preserve.sh curator_seed_state.sh curator_bind_preflight.sh check_curator_mounts.sh curator_state.map | base64 -w 0)
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids ${{ secrets.EC2_INSTANCE_ID }} \
            --document-name "AWS-RunShellScript" \
            --parameters "commands=[\"set -e\",\"mkdir -p /opt/minimoi/scripts\",\"echo $CURATOR_STATE_KIT | base64 -d | tar -xzf - --no-same-owner -C /opt/minimoi/scripts\",\"echo $MANUAL_DEPLOY | base64 -d > /opt/minimoi/deploy.sh\",\"chmod 755 /opt/minimoi/deploy.sh\",\"chmod 755 /opt/minimoi/scripts/curator_preserve.sh /opt/minimoi/scripts/curator_seed_state.sh /opt/minimoi/scripts/curator_bind_preflight.sh /opt/minimoi/scripts/check_curator_mounts.sh\"]" \
            --query 'Command.CommandId' \
            --output text)
          echo "Curator kit command ID: $COMMAND_ID"
          for i in $(seq 1 60); do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id ${{ secrets.EC2_INSTANCE_ID }} \
              --query 'Status' --output text 2>/dev/null || echo "Pending")
            echo "[$i/60] Curator kit status: $STATUS"
            if [ "$STATUS" = "Success" ]; then break; fi
            if [ "$STATUS" = "Failed" ] || [ "$STATUS" = "Cancelled" ] || [ "$STATUS" = "TimedOut" ]; then
              aws ssm get-command-invocation \
                --command-id "$COMMAND_ID" \
                --instance-id ${{ secrets.EC2_INSTANCE_ID }} \
                --query 'StandardErrorContent' --output text 2>/dev/null || true
              exit 1
            fi
            sleep 5
          done
          [ "$STATUS" = "Success" ] || { echo "Curator kit push timed out"; exit 1; }

      # Its own SSM command (size limit above). Host scripts that run outside an image come from this commit, and the
      # daily parity check compares every listed host script with it (#505: the backup script stayed a hand-installed
      # old copy, so the CoS store had no backup; #506). Drift is reported, never fatal to the deploy.
      - name: Install host scripts and check parity on EC2
        run: |
          python3 scripts/operations/host_script_parity.py bundle --commit "${{ github.sha }}" --out /tmp/host-scripts.tgz
          HOST_SCRIPTS=$(base64 -w 0 /tmp/host-scripts.tgz)
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids ${{ secrets.EC2_INSTANCE_ID }} \
            --document-name "AWS-RunShellScript" \
            --parameters "commands=[\"set -e\",\"D=\$(mktemp -d /tmp/host-scripts.XXXXXX)\",\"echo $HOST_SCRIPTS | base64 -d | tar -xzf - --no-same-owner -C \$D\",\"python3 -I -B \$D/scripts/operations/host_script_parity.py install --from \$D\",\"rm -rf \$D\",\"python3 -I -B /opt/minimoi/scripts/host_script_parity.py install-cron\",\"python3 -I -B /opt/minimoi/scripts/host_script_parity.py check --notify || echo parity: drift reported\"]" \
            --query 'Command.CommandId' \
            --output text)
          echo "Host scripts command ID: $COMMAND_ID"
          for i in $(seq 1 60); do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id ${{ secrets.EC2_INSTANCE_ID }} \
              --query 'Status' --output text 2>/dev/null || echo "Pending")
            echo "[$i/60] Host scripts status: $STATUS"
            if [ "$STATUS" = "Success" ]; then break; fi
            if [ "$STATUS" = "Failed" ] || [ "$STATUS" = "Cancelled" ] || [ "$STATUS" = "TimedOut" ]; then
              aws ssm get-command-invocation \
                --command-id "$COMMAND_ID" \
                --instance-id ${{ secrets.EC2_INSTANCE_ID }} \
                --query 'StandardErrorContent' --output text 2>/dev/null || true
              exit 1
            fi
            sleep 5
          done
          [ "$STATUS" = "Success" ] || { echo "Host scripts push timed out"; exit 1; }
          aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id ${{ secrets.EC2_INSTANCE_ID }} \
            --query 'StandardOutputContent' --output text | tail -5

      # Code support only: host-owned binding/state/keys are never uploaded.
      - name: Push optional Records deployment support to EC2
        run: |
          # The workers' project file too (#550): guildhall_prod.sh refresh, below, runs the workers from it.
          RECORDS_DEPLOY_KIT=$(tar -czf - scripts/rooms/production_plan.py scripts/rooms/deployment.py docker-compose.records-production.yml docker-compose.records-production-portal.yml docker-compose.guildhall-production.yml | base64 -w 0)
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids ${{ secrets.EC2_INSTANCE_ID }} \
            --document-name "AWS-RunShellScript" \
            --parameters "commands=[\"set -e\",\"echo $RECORDS_DEPLOY_KIT | base64 -d | tar -xzf - --no-same-owner -C /opt/minimoi\"]" \
            --query 'Command.CommandId' --output text)
          for i in $(seq 1 60); do
            STATUS=$(aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id ${{ secrets.EC2_INSTANCE_ID }} --query 'Status' --output text 2>/dev/null || echo Pending)
            if [ "$STATUS" = Success ]; then break; fi
            case "$STATUS" in Failed|Cancelled|TimedOut) echo "Records support sync failed"; exit 1;; esac
            sleep 5
          done
          [ "$STATUS" = Success ] || { echo "Records support sync unconfirmed"; exit 1; }

      # Its own SSM command: the compose sync above is near AWS's 97 KB command limit (26 Oct 2026). The Deploy step
      # runs `cos_prod.sh prepare`.
      - name: Push CoS operations script to EC2
        run: |
          COS_PROD=$(base64 -w 0 scripts/operations/cos_prod.sh)
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids ${{ secrets.EC2_INSTANCE_ID }} \
            --document-name "AWS-RunShellScript" \
            --parameters "commands=[\"set -e\",\"mkdir -p /opt/minimoi/scripts\",\"echo $COS_PROD | base64 -d > /opt/minimoi/scripts/cos_prod.sh\",\"chmod 755 /opt/minimoi/scripts/cos_prod.sh\"]" \
            --query 'Command.CommandId' --output text)
          for i in $(seq 1 60); do
            STATUS=$(aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id ${{ secrets.EC2_INSTANCE_ID }} --query 'Status' --output text 2>/dev/null || echo Pending)
            if [ "$STATUS" = Success ]; then break; fi
            case "$STATUS" in Failed|Cancelled|TimedOut) echo "CoS script push failed"; exit 1;; esac
            sleep 5
          done
          [ "$STATUS" = Success ] || { echo "CoS script push unconfirmed"; exit 1; }

      # Its own SSM command, for the same reason. Placing a layer on the host is the operator's act, on Robert's word: that
      # is the opt-in, and a layer here before setup finishes would refuse the release on its required settings. So this
      # only keeps a layer already switched on in step with the release; a host without one stays as it is. The new release
      # script is already in place, and it renders the layers before it changes anything.
      - name: Refresh the production layers already switched on
        run: |
          RELEASE_LAYERS=$(tar -czf - docker-compose.minimoi-1-2-production.yml docker-compose.guildhall-production-main.yml | base64 -w 0)
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids ${{ secrets.EC2_INSTANCE_ID }} \
            --document-name "AWS-RunShellScript" \
            --parameters "commands=[\"set -e\",\"rm -rf /opt/minimoi/release-layers\",\"install -d -m 0755 /opt/minimoi/release-layers\",\"echo $RELEASE_LAYERS | base64 -d | tar -xzf - --no-same-owner -C /opt/minimoi/release-layers\",\"for f in docker-compose.minimoi-1-2-production.yml docker-compose.guildhall-production-main.yml; do if [ -f /opt/minimoi/\$f ]; then install -m 0644 /opt/minimoi/release-layers/\$f /opt/minimoi/\$f; fi; done\"]" \
            --query 'Command.CommandId' --output text)
          for i in $(seq 1 60); do
            STATUS=$(aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id ${{ secrets.EC2_INSTANCE_ID }} --query 'Status' --output text 2>/dev/null || echo Pending)
            if [ "$STATUS" = Success ]; then break; fi
            case "$STATUS" in Failed|Cancelled|TimedOut) echo "Layer refresh failed"; exit 1;; esac
            sleep 5
          done
          [ "$STATUS" = Success ] || { echo "Layer refresh unconfirmed"; exit 1; }

      # A release that changes only Guildhall (release class "guildhall") names no main service: nothing to recreate here.
      - name: Deploy on EC2
        id: deploy_main
        if: needs.classify.outputs.services != ''
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids ${{ secrets.EC2_INSTANCE_ID }} \
            --document-name "AWS-RunShellScript" \
            --timeout-seconds 1800 \
            --parameters 'commands=[
              "set -e",
              "mkdir -p /opt/minimoi/data/portuguese",
              "mkdir -p /opt/minimoi/data/german",
              "mkdir -p /opt/minimoi/data/guild",
              "touch /opt/minimoi/data/model_gateway_receipts.jsonl",
              "/opt/minimoi/scripts/seed_build_queue.sh https://raw.githubusercontent.com/robertvanstedum/personal-ai-agents/${{ github.sha }}/data/guild/build_queue.json /opt/minimoi/data/guild/build_queue.json",
              "cd /opt/minimoi",
              "/opt/minimoi/scripts/sync_cos_runtime_secrets_from_ssm.sh /opt/minimoi/.env",
              "/opt/minimoi/scripts/cos_prod.sh prepare",
              "MINIMOI_RELEASE_COMMIT=${{ github.sha }} /opt/minimoi/scripts/deploy_scoped_release.sh ${{ needs.build-push.outputs.image_tag }} ${{ needs.classify.outputs.services }}"
            ],executionTimeout=["1800"]' \
            --query 'Command.CommandId' \
            --output text)

          echo "Deploy command ID: $COMMAND_ID"

          # Poll until EC2 confirms completion. Use || echo "Pending" so set -e does not
          # abort on InvocationDoesNotExist (returned when polled too soon after send-command).
          for i in $(seq 1 180); do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id ${{ secrets.EC2_INSTANCE_ID }} \
              --query 'Status' --output text 2>/dev/null || echo "Pending")
            echo "[$i/180] Deploy status: $STATUS"
            if [ "$STATUS" = "Success" ]; then break; fi
            if [ "$STATUS" = "Failed" ] || [ "$STATUS" = "Cancelled" ] || [ "$STATUS" = "TimedOut" ]; then
              echo "EC2 deploy FAILED with status: $STATUS"
              aws ssm get-command-invocation \
                --command-id "$COMMAND_ID" \
                --instance-id ${{ secrets.EC2_INSTANCE_ID }} \
                --query 'StandardErrorContent' --output text 2>/dev/null || true
              exit 1
            fi
            sleep 10
          done

          if [ "$STATUS" != "Success" ]; then
            echo "Deploy timed out after 30 minutes"
            exit 1
          fi

          echo "Deploy confirmed successful on EC2"

      - name: Verify the portal sees the live Build Queue
        run: |
          # The portal must Save into the host's live queue, never into a copy
          # in its own image: the folder must be mounted at /app/runtime/guild,
          # GUILD_QUEUE_PATH must point into it, the store's write_problem()
          # run inside the container must say Save is on, and the queue
          # checksum inside the container must equal the host file's.
          QUEUE_CHECK=$(base64 -w 0 scripts/operations/check_queue_mount.sh)
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids ${{ secrets.EC2_INSTANCE_ID }} \
            --document-name "AWS-RunShellScript" \
            --parameters "commands=[\"set -e\",\"echo $QUEUE_CHECK | base64 -d > /opt/minimoi/scripts/check_queue_mount.sh\",\"chmod +x /opt/minimoi/scripts/check_queue_mount.sh\",\"/opt/minimoi/scripts/check_queue_mount.sh /opt/minimoi/data/guild/build_queue.json minimoi-portal /app/runtime/guild/build_queue.json\"]" \
            --query 'Command.CommandId' \
            --output text)

          echo "Queue check command ID: $COMMAND_ID"
          for i in $(seq 1 30); do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id ${{ secrets.EC2_INSTANCE_ID }} \
              --query 'Status' --output text 2>/dev/null || echo "Pending")
            echo "[$i/30] Queue check status: $STATUS"
            if [ "$STATUS" = "Success" ] || [ "$STATUS" = "Failed" ] || [ "$STATUS" = "Cancelled" ] || [ "$STATUS" = "TimedOut" ]; then break; fi
            sleep 5
          done
          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id ${{ secrets.EC2_INSTANCE_ID }} \
            --query '[StandardOutputContent, StandardErrorContent]' --output text 2>/dev/null || true
          if [ "$STATUS" != "Success" ]; then
            echo "Queue check FAILED ($STATUS): the portal is not attached to the live Build Queue"
            exit 1
          fi

      # The Guildhall stack (#550, #548): minimoi-records runs the portal image and the two workers their own image.
      # Once Guildhall is switched on (by hand, guildhall_prod.sh start), every release that moves either image refreshes it
      # here, in this job, so the one-deploy-at-a-time queue covers it. The script is the one the host scripts step just
      # installed from this commit: every gate first (production_internal only, no public Records port, the tokens agreeing,
      # the binding and network), Records' preflight on the new image, health and Robert's Rooms access verified after, and
      # what it changed put back if a step fails. A failure fails this deploy, with the script's own words.
      - name: Refresh the Guildhall stack
        id: guildhall
        if: needs.classify.outputs.guildhall == 'true'
        env:
          WORKER_IMAGE: ${{ needs.build-worker.outputs.image }}
          REASONS: ${{ needs.classify.outputs.guildhall_reasons }}
        run: |
          echo "Guildhall: $REASONS"
          if [[ -n "$WORKER_IMAGE" && ! "$WORKER_IMAGE" =~ ^332704997792\.dkr\.ecr\.us-east-1\.amazonaws\.com/minimoi/cos-scheduler@sha256:[a-f0-9]{64}$ ]]; then
            echo "result=refused" >> "$GITHUB_OUTPUT"
            echo "::error title=Guildhall refresh refused::the worker image is not an immutable digest"; exit 1
          fi
          python3 -c 'import json, sys; print(json.dumps({"commands": ["cd /opt/minimoi", "GUILDHALL_PROD_APPROVED=1 MINIMOI_RELEASE_COMMIT=%s MINIMOI_ROOMS_WORKER_IMAGE=%s /opt/minimoi/scripts/guildhall_prod.sh refresh" % (sys.argv[1], sys.argv[2])], "executionTimeout": ["1500"]}))' \
            "${{ github.sha }}" "$WORKER_IMAGE" > "$RUNNER_TEMP/guildhall.json"
          rc=0
          SSM_STDOUT="$RUNNER_TEMP/guildhall.out" bash scripts/ci/ssm_run.sh "Guildhall refresh" 1500 "$RUNNER_TEMP/guildhall.json" || rc=$?
          RESULT=$(sed -n 's/^guildhall-result: //p' "$RUNNER_TEMP/guildhall.out" 2>/dev/null | tail -1)
          echo "result=${RESULT:-unknown}" >> "$GITHUB_OUTPUT"
          case "${RESULT:-unknown}" in
            refreshed|current|skipped) [ "$rc" = 0 ] && exit 0 ;;
            refused) echo "::error title=Guildhall refresh refused::a gate refused; Guildhall is unchanged on its previous images. Read the gates above." ;;
            rolled_back) echo "::error title=Guildhall refresh failed and was put back::Guildhall runs its previous images and verifies; this release's Guildhall part is not live." ;;
            rollback_failed) echo "::error title=Guildhall is NOT verified::the refresh failed and could not put everything back. Act now: guildhall_prod.sh status on the host." ;;
            *) echo "::error title=Guildhall refresh unconfirmed::no result line came back; check guildhall_prod.sh status on the host." ;;
          esac
          exit 1

      # MC's own image releases on an mc-agent-v* tag (deploy-mc-agent.yml). Not automatic: the tag is MC's release name,
      # chosen with its persona release, and a tag pushed with this workflow's token would start no workflow. So every
      # release compares the tag production runs with this commit and says loudly when MC's image is behind.
      - name: Check MC's own image against this release
        id: mc
        if: always()
        run: |
          printf '%s' '{"commands": ["docker inspect --format {{.Config.Image}} minimoi-mc-agent 2>/dev/null || true"], "executionTimeout": ["60"]}' > "$RUNNER_TEMP/mc.json"
          SSM_STDOUT="$RUNNER_TEMP/mc.out" bash scripts/ci/ssm_run.sh "MC agent read" 120 "$RUNNER_TEMP/mc.json" >/dev/null || true
          LIVE=$(sed -n 's/.*:\(mc-agent-v[0-9]*\.[0-9]*\.[0-9]*[A-Za-z0-9.-]*\)$/\1/p' "$RUNNER_TEMP/mc.out" 2>/dev/null | head -1)
          echo "live=$LIVE" >> "$GITHUB_OUTPUT"
          # Just that tag's commit: a diff of two commits needs no shared history.
          [ -z "$LIVE" ] || git fetch -q --no-tags --depth=1 origin "refs/tags/$LIVE:refs/tags/$LIVE" || true
          if [ -z "$LIVE" ] || ! git rev-parse -q --verify "refs/tags/$LIVE" >/dev/null; then
            echo "needed=unknown" >> "$GITHUB_OUTPUT"
            echo "::warning title=MC agent release unknown::could not read the MC release tag production runs (${LIVE:-none}); check deploy-mc-agent.yml by hand"
            exit 0
          fi
          git diff --name-only "$LIVE" "${{ github.sha }}" | python3 scripts/ci/classify_release.py --mc-agent > "$RUNNER_TEMP/mc-changes.json"
          COUNT=$(python3 -c 'import json, sys; print(json.load(open(sys.argv[1]))["count"])' "$RUNNER_TEMP/mc-changes.json")
          echo "changes=$COUNT" >> "$GITHUB_OUTPUT"
          if [ "$COUNT" -gt 0 ]; then
            echo "needed=yes" >> "$GITHUB_OUTPUT"
            echo "::warning title=MC agent release needed::$COUNT file(s) MC's image holds changed since $LIVE. Tag an mc-agent-v* release (deploy-mc-agent.yml)."
            python3 -c 'import json, sys; print("\n".join(json.load(open(sys.argv[1]))["mc_agent_changes"][:20]))' "$RUNNER_TEMP/mc-changes.json"
          else
            echo "needed=no" >> "$GITHUB_OUTPUT"
          fi

      # PRODUCTION.md says what every stack runs (#536): the release script wrote the main part; this adds the Guildhall
      # refresh (guildhall_prod.sh's own observation) and MC's tag. Never fails the deploy.
      - name: Record every stack in the production delivery record
        if: always()
        env:
          LIVE: ${{ steps.mc.outputs.live }}
          NEEDED: ${{ steps.mc.outputs.needed }}
          CHANGES: ${{ steps.mc.outputs.changes }}
        run: |
          python3 -c '
          import json, re, sys
          live, needed, changes = sys.argv[1:4]
          argv = ["python3", "-I", "-B", "/opt/minimoi/scripts/write_production_delivery_record.py"]
          if re.fullmatch(r"mc-agent-v[0-9A-Za-z.-]{1,40}", live):
              argv += ["--mc-agent-live", live]
          if needed in ("yes", "no", "unknown"):
              argv += ["--mc-agent-needed", needed]
          if changes.isdigit():
              argv += ["--mc-agent-changes", changes]
          print(json.dumps({"commands": [" ".join(argv) + " || echo delivery record: not written"], "executionTimeout": ["60"]}))
          ' "$LIVE" "$NEEDED" "$CHANGES" > "$RUNNER_TEMP/record.json"
          bash scripts/ci/ssm_run.sh "Delivery record" 120 "$RUNNER_TEMP/record.json" || echo "delivery record: not confirmed"

      - name: Say which stacks this release refreshed
        if: always()
        env:
          SERVICES: ${{ needs.classify.outputs.services }}
          MAIN: ${{ steps.deploy_main.outcome }}
          GUILDHALL_NAMED: ${{ needs.classify.outputs.guildhall }}
          GUILDHALL: ${{ steps.guildhall.outputs.result }}
          GUILDHALL_STEP: ${{ steps.guildhall.outcome }}
          WORKER_IMAGE: ${{ needs.build-worker.outputs.image }}
          MC_LIVE: ${{ steps.mc.outputs.live }}
          MC_NEEDED: ${{ steps.mc.outputs.needed }}
          MC_CHANGES: ${{ steps.mc.outputs.changes }}
        run: python3 scripts/ci/release_summary.py >> "$GITHUB_STEP_SUMMARY"

  deploy-docs:
    needs: [classify, test]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push' && needs.classify.outputs.release_class == 'documents'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Publish docs/specs and build queue without restarting containers
        run: ./scripts/sync_docs.sh

  notify:
    needs: [test, build-push, deploy, deploy-docs]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Send Telegram notification
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          pip install requests -q
          python3 scripts/notify_deploy.py \
            --deploy-status "${{ needs.deploy.result == 'skipped' && needs.deploy-docs.result || needs.deploy.result }}" \
            --test-status "${{ needs.test.result }}" \
            --sha "${{ github.sha }}" \
            --branch "${{ github.ref_name }}"
