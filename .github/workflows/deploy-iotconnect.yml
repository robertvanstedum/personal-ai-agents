name: IoT Connect demo release

# Tag-only release of the IoT Connect reference demo
# (docs/specs/spec_154_iot_connect_minimoi_production_hosting_2026-09-04.md §8.3).
# Never runs on push to main. Deploys ONLY the independent `iotconnect` Compose
# project via scripts/operations/deploy_iotconnect_ec2.sh.

on:
  push:
    tags: ['iotconnect-v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing approved iotconnect-v* tag to (re)deploy'
        required: true

env:
  REGISTRY: 332704997792.dkr.ecr.us-east-1.amazonaws.com
  APP_DIR: prototype-lab/projects/project-iot-connect

jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.t.outputs.tag }}
    steps:
      - id: t
        env:
          INPUT_TAG: ${{ github.event.inputs.tag }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then TAG="$INPUT_TAG"; else TAG="${GITHUB_REF#refs/tags/}"; fi
          # Validate before the value reaches any shell/SSM command.
          [[ "$TAG" =~ ^iotconnect-v[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.]+)?$ ]] || { echo "invalid tag '$TAG'"; exit 1; }
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

  verify-build-push:
    needs: resolve
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.tag }}

      - name: Tagged source sanity
        run: |
          test -f "$APP_DIR/Dockerfile" && test -f "$APP_DIR/requirements.lock" && test -f "$APP_DIR/Makefile"
          grep -q '^FROM python:3.12-slim@sha256:' "$APP_DIR/Dockerfile"

      - name: Standalone verification suite (tests + scan, memory backend)
        working-directory: prototype-lab/projects/project-iot-connect
        run: |
          make test
          make scan

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, push, record digest
        id: push
        run: |
          TAG=${{ needs.resolve.outputs.tag }}
          IMG="$REGISTRY/minimoi/iotconnect:$TAG"
          docker build --platform linux/amd64 -t "$IMG" "$APP_DIR"
          docker push "$IMG"
          DIGEST=$(docker inspect --format '{{index .RepoDigests 0}}' "$IMG" | sed 's/.*@//')
          echo "pushed $IMG @ $DIGEST"
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"

  deploy:
    needs: [resolve, verify-build-push]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.tag }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Sync ONLY the IoT Connect compose file and deploy script, then deploy
        run: |
          TAG=${{ needs.resolve.outputs.tag }}
          DIGEST=${{ needs.verify-build-push.outputs.digest }}
          COMPOSE=$(base64 -w 0 docker-compose.iotconnect.prod.yml)
          SCRIPT=$(base64 -w 0 scripts/operations/deploy_iotconnect_ec2.sh)
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids ${{ secrets.EC2_INSTANCE_ID }} \
            --document-name "AWS-RunShellScript" \
            --timeout-seconds 900 \
            --parameters "commands=[\"set -e\",\"mkdir -p /opt/minimoi/iotconnect\",\"echo $COMPOSE | base64 -d > /opt/minimoi/iotconnect/docker-compose.yml\",\"echo $SCRIPT | base64 -d > /opt/minimoi/iotconnect/deploy.sh\",\"chmod +x /opt/minimoi/iotconnect/deploy.sh\",\"/opt/minimoi/iotconnect/deploy.sh $TAG $DIGEST\"]" \
            --query 'Command.CommandId' --output text)
          echo "Deploy command ID: $COMMAND_ID"
          for i in $(seq 1 90); do
            STATUS=$(aws ssm get-command-invocation --command-id "$COMMAND_ID" \
              --instance-id ${{ secrets.EC2_INSTANCE_ID }} --query 'Status' --output text 2>/dev/null || echo Pending)
            echo "[$i/90] $STATUS"
            [ "$STATUS" = "Success" ] && break
            case "$STATUS" in Failed|Cancelled|TimedOut)
              aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id ${{ secrets.EC2_INSTANCE_ID }} \
                --query '[StandardOutputContent,StandardErrorContent]' --output text 2>/dev/null || true
              exit 1;;
            esac
            sleep 10
          done
          [ "$STATUS" = "Success" ]
          aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id ${{ secrets.EC2_INSTANCE_ID }} \
            --query 'StandardOutputContent' --output text | tail -25
