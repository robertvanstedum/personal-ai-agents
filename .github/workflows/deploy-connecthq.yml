name: Connect HQ demo deploy

# Builds and deploys the standalone Connect HQ IoT demo as a FROZEN tag.
# Runs only on a `connecthq-v*` tag (or a manual dispatch naming one). It never
# runs on push to main, and the main pipeline never touches the demo because
# the Connect HQ services sit behind the `connecthq` compose profile.

on:
  push:
    tags: ['connecthq-v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing connecthq-v* git tag to build and deploy'
        required: true

env:
  REGISTRY: 332704997792.dkr.ecr.us-east-1.amazonaws.com
  APP_DIR: prototype-lab/projects/project-connect-hq

jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.t.outputs.tag }}
    steps:
      - id: t
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ github.event.inputs.tag }}" >> $GITHUB_OUTPUT
          else
            echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          fi

  build-push:
    needs: resolve
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.tag }}

      - name: Sanity — app directory and lock file present at the tag
        run: |
          test -f "$APP_DIR/Dockerfile"
          test -f "$APP_DIR/requirements.lock"
          test -f "$APP_DIR/docker-compose.yml"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push (linux/amd64 for the EC2 host)
        run: |
          TAG=${{ needs.resolve.outputs.tag }}
          docker build --platform linux/amd64 \
            -t "$REGISTRY/minimoi/connecthq:$TAG" \
            "$APP_DIR"
          docker push "$REGISTRY/minimoi/connecthq:$TAG"

  deploy:
    needs: [resolve, build-push]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.tag }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Push docker-compose.prod.yml from the tag to EC2
        run: |
          COMPOSE=$(base64 -w 0 docker-compose.prod.yml)
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids ${{ secrets.EC2_INSTANCE_ID }} \
            --document-name "AWS-RunShellScript" \
            --parameters "commands=[\"echo $COMPOSE | base64 -d > /opt/minimoi/docker-compose.prod.yml\"]" \
            --query 'Command.CommandId' --output text)
          for i in $(seq 1 30); do
            STATUS=$(aws ssm get-command-invocation --command-id "$COMMAND_ID" \
              --instance-id ${{ secrets.EC2_INSTANCE_ID }} --query 'Status' --output text 2>/dev/null || echo Pending)
            [ "$STATUS" = "Success" ] && break
            case "$STATUS" in Failed|Cancelled|TimedOut) echo "compose sync $STATUS"; exit 1;; esac
            sleep 5
          done
          [ "$STATUS" = "Success" ]

      - name: Deploy the frozen tag on EC2
        run: |
          TAG=${{ needs.resolve.outputs.tag }}
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids ${{ secrets.EC2_INSTANCE_ID }} \
            --document-name "AWS-RunShellScript" \
            --timeout-seconds 600 \
            --parameters "commands=[
              \"set -e\",
              \"cd /opt/minimoi\",
              \"grep -q '^CONNECTHQ_DB_PASSWORD=' /opt/minimoi/.env || printf 'CONNECTHQ_DB_PASSWORD=%s\\\\n' \\\"\$(aws ssm get-parameter --region us-east-1 --name /minimoi/production/connecthq_db_password --with-decryption --query Parameter.Value --output text)\\\" >> /opt/minimoi/.env\",
              \"aws ecr get-login-password --region us-east-1 | docker login --username AWS --password-stdin $REGISTRY\",
              \"export CONNECTHQ_IMAGE_TAG=$TAG\",
              \"docker-compose -f /opt/minimoi/docker-compose.prod.yml --profile connecthq pull connecthq connecthq-integrations\",
              \"docker-compose -f /opt/minimoi/docker-compose.prod.yml --profile connecthq up -d connecthq-postgres connecthq-integrations connecthq\",
              \"for i in \$(seq 1 24); do test \\\"\$(docker inspect --format={{.State.Health.Status}} minimoi-connecthq)\\\" = healthy && break; sleep 5; done\",
              \"test \\\"\$(docker inspect --format={{.State.Health.Status}} minimoi-connecthq)\\\" = healthy\",
              \"test \\\"\$(docker inspect --format={{.Config.Image}} minimoi-connecthq)\\\" = \\\"$REGISTRY/minimoi/connecthq:$TAG\\\"\",
              \"curl -sf http://localhost:8095/api/v1/health\",
              \"curl -sf -o /dev/null -w '%{http_code}' http://localhost:5001/health\",
              \"docker-compose -f /opt/minimoi/docker-compose.prod.yml up -d --no-deps portal\",
              \"sleep 5\",
              \"curl -sf http://localhost:5001/health\"
            ]" \
            --query 'Command.CommandId' --output text)
          echo "Deploy command ID: $COMMAND_ID"
          for i in $(seq 1 60); do
            STATUS=$(aws ssm get-command-invocation --command-id "$COMMAND_ID" \
              --instance-id ${{ secrets.EC2_INSTANCE_ID }} --query 'Status' --output text 2>/dev/null || echo Pending)
            echo "[$i/60] $STATUS"
            [ "$STATUS" = "Success" ] && break
            case "$STATUS" in Failed|Cancelled|TimedOut)
              aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id ${{ secrets.EC2_INSTANCE_ID }} \
                --query 'StandardErrorContent' --output text 2>/dev/null || true
              exit 1;;
            esac
            sleep 10
          done
          [ "$STATUS" = "Success" ]
