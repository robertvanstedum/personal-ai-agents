# Connect HQ reference demo — production Compose (EC2), INDEPENDENT of the
# mini-moi project. Spec #154 §6–§8.
#
#   Compose project name : connecthq            (never the mini-moi project)
#   Host path            : /opt/minimoi/connecthq/docker-compose.yml
#   Env file             : /opt/minimoi/connecthq/.env  (written from SSM on every deploy)
#   Deployed by          : .github/workflows/deploy-connecthq.yml on a connecthq-v* tag
#   Image                : minimoi/connecthq:${CONNECTHQ_IMAGE_TAG} — NEVER MINIMOI_IMAGE_TAG
#
# Isolation contract:
#   * The mini-moi main deploy never pulls, recreates, or orphans these
#     services (different project, different file).
#   * This project never touches mini-moi containers; it only joins the
#     pre-existing `connecthq-edge` network so the portal can reach the app.
#   * Only the app binds to EC2 loopback. Integrations and PostgreSQL have no
#     host ports. The shared postgres-ai-agents database is not used.
#
# First-release sequencing:
#   1. Merge the portal change (docker-compose.prod.yml gains CONNECTHQ_BACKEND
#      and the connecthq-edge network) and let the ordinary main deploy run.
#   2. Create ECR repo minimoi/connecthq + push rights; put the DB password in
#      SSM /minimoi/production/connecthq_db_password (Robert).
#   3. Promote Connect HQ into prototype-lab/ and push tag connecthq-v0.9.0-beta.1.
#   4. The tag workflow builds, pushes, and runs scripts/operations/deploy_connecthq_ec2.sh.
#   5. Owner opens Guild → Improve → Launch Connect HQ.

name: connecthq

services:
  postgres:
    # Accepted beta gap: floating 16.x minor. Pin by digest before a later release.
    image: postgres:16-alpine
    container_name: minimoi-connecthq-postgres
    restart: unless-stopped
    env_file: /opt/minimoi/connecthq/.env
    environment:
      - POSTGRES_DB=connecthq
      - POSTGRES_USER=connecthq_app
      - POSTGRES_PASSWORD=${CONNECTHQ_DB_PASSWORD:?CONNECTHQ_DB_PASSWORD missing from /opt/minimoi/connecthq/.env}
    volumes:
      - connecthq-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U connecthq_app -d connecthq"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 5s

  integrations:
    image: 332704997792.dkr.ecr.us-east-1.amazonaws.com/minimoi/connecthq:${CONNECTHQ_IMAGE_TAG:?CONNECTHQ_IMAGE_TAG must name the approved connecthq-v* tag}
    container_name: minimoi-connecthq-integrations
    restart: unless-stopped
    command: ["uvicorn", "integration_stubs.main:app", "--host", "0.0.0.0", "--port", "8096"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8096/mock/flowone/v1/health', timeout=3).status == 200 else 1)"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s

  app:
    image: 332704997792.dkr.ecr.us-east-1.amazonaws.com/minimoi/connecthq:${CONNECTHQ_IMAGE_TAG:?CONNECTHQ_IMAGE_TAG must name the approved connecthq-v* tag}
    container_name: minimoi-connecthq
    restart: unless-stopped
    env_file: /opt/minimoi/connecthq/.env
    environment:
      - WHAM_V3_STORE=postgres
      - POSTGRES_DSN=postgresql://connecthq_app:${CONNECTHQ_DB_PASSWORD:?CONNECTHQ_DB_PASSWORD missing}@postgres:5432/connecthq
      - FLOWONE_BASE_URL=http://integrations:8096
      - AMDOCS_MIDDLEWARE_BASE_URL=http://integrations:8096
      - CONNECTHQ_INTEGRATIONS_URL=http://integrations:8096
      - CONNECTHQ_APP_URL=http://127.0.0.1:8095
      - CONNECTHQ_SEED_TIMESTAMP=${CONNECTHQ_SEED_TIMESTAMP:-2026-08-01T00:00:00+00:00}
      # Hosted contract (Spec #154 §4.3, §5): trusted portal identity, one
      # base-path strategy (app emits prefixed URLs; the portal rewrite is idempotent).
      - CONNECTHQ_AUTH_MODE=minimoi_proxy
      - CONNECTHQ_ROOT_PATH=/app/connecthq
    ports:
      - "127.0.0.1:8095:8095"
    networks:
      - default
      - connecthq-edge
    depends_on:
      postgres:
        condition: service_healthy
      integrations:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8095/api/v1/health', timeout=3).status == 200 else 1)"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

volumes:
  connecthq-postgres-data:

networks:
  default:
  connecthq-edge:
    external: true
