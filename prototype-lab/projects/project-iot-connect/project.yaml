schema_version: "0.1"
id: project-iot-connect
name: IoT Connect Demo Program
status: design_review
owner: robert
decision_owner: robert
created_at: 2026-09-02

purpose:
  business_question: >-
    Can the existing IoT Connect prototype become a portable, repeatable
    demonstration and then support a materially different fiber
    order-to-activate-to-bill scenario without forking an unmaintainable copy?
  success_criteria:
    - a clean checkout starts, resets, verifies, and stops with documented commands
    - the existing IoT scenario remains repeatable and independently releasable
    - the fiber scenario models real product, service, resource, and billing boundaries
    - Salesforce can act as an optional real CRM and order-entry adapter
    - the learning package maps the fiber lifecycle through Zuora order-to-cash processes
    - a synthetic Zuora service validates an approved subset of the published API contract
    - a synthetic payment gateway demonstrates idempotent payment outcomes and dunning events
    - IoT Connect has an approved fiber-specific orchestration and operational-control boundary
    - the same correlation identifier is visible across order, activation, billing, and evidence
    - private interview context and credentials never enter committed artifacts

workstreams:
  - id: WS0
    name: promote_working_prototype
    owner_role: implementation
    gate: G0A
  - id: WS1
    name: standalone_demo_formalization
    owner_role: implementation
