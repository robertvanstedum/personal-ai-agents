<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>IoT Connect · Account statement</title>
  <style>
    :root{--navy:#082940;--teal:#07897f;--ink:#142033;--muted:#627086;--line:#d7e0e4;--soft:#f4f7f8}*{box-sizing:border-box}body{margin:0;background:#eef2f3;color:var(--ink);font-family:Inter,Arial,sans-serif}.toolbar{display:flex;justify-content:space-between;align-items:center;padding:12px 22px;background:var(--navy);color:white}.toolbar strong{font-size:15px}.toolbar button{padding:8px 13px;border:1px solid #9ec8c4;border-radius:5px;background:white;color:var(--teal);font-weight:700}.sheet{width:min(960px,calc(100% - 32px));margin:22px auto;padding:34px 38px;background:white;box-shadow:0 10px 28px #17324218}.statement-head{display:flex;justify-content:space-between;gap:30px;padding-bottom:22px;border-bottom:3px solid var(--navy)}.brand h1{margin:0;font-size:24px}.brand p,.invoice-title p{margin:6px 0 0;color:var(--muted);font-size:11px}.invoice-title{text-align:right}.invoice-title h2{margin:0;font-size:22px}.facts{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:18px 0}.fact{padding:11px;background:var(--soft)}.fact span{display:block;color:var(--muted);font-size:9px;text-transform:uppercase}.fact strong{display:block;margin-top:5px;font-size:12px}.addresses{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin:20px 0}.addresses h3{margin:0 0 7px;font-size:10px;text-transform:uppercase;color:var(--muted)}.addresses p{margin:3px 0;font-size:12px}.summary{display:grid;grid-template-columns:1fr 270px;gap:24px;align-items:start}.boundary{padding:13px;border-left:3px solid var(--teal);background:#eef9f7;color:#365f5b;font-size:10px;line-height:1.5}.amount{padding:16px;background:var(--navy);color:white}.amount span{display:block;font-size:10px}.amount strong{display:block;margin-top:7px;font-size:26px}table{width:100%;margin-top:22px;border-collapse:collapse}th,td{padding:9px 8px;border-bottom:1px solid var(--line);font-size:10px;text-align:left}th{color:var(--muted);font-size:8.5px;text-transform:uppercase}.num{text-align:right}.total td{border-top:2px solid var(--navy);font-size:12px;font-weight:800}.foot{margin-top:24px;padding-top:13px;border-top:1px solid var(--line);color:var(--muted);font-size:9px;line-height:1.5}.error{padding:30px;color:#8d2929}@media print{body{background:white}.toolbar{display:none}.sheet{width:100%;margin:0;box-shadow:none}}
  </style>
</head>
<body><header class="toolbar"><strong>IoT Connect · Legacy Billing statement artifact</strong><button onclick="window.print()">Print or save PDF</button></header><main id="statementSheet" class="sheet"><div>Loading statement…</div></main><script src="/static/api-client.js"></script><script src="/static/statement.js"></script></body>
</html>
