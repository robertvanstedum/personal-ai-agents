# Staging override — dev.minimoi.ai on Robert's Mac (issue #234).
#
# Layered on top of docker-compose.prod.yml. Use ONLY through
# scripts/staging/*.sh (lib.sh builds the one compose command line):
#   docker compose -p minimoi-staging \
#     --env-file $MINIMOI_ROOT/.env --env-file $MINIMOI_ROOT/release.env \
#     -f docker-compose.prod.yml -f docker-compose.staging.yml ...
#
# What changes against production, and nothing else:
#   * images: built locally from the pinned release commit (native arm64),
#     named minimoi-staging/<ECR repository>:<tag>, never pulled
#     (pull_policy: never). postgres keeps the local postgres:latest image
#     (PG 18.4): never pulled, so it cannot jump a major version.
#   * MINIMOI_ROLE=standby on every Python service, so bots, crons and
#     token lookups use the test path (production also defaults to
#     "production" when the variable is unset).
#   * portal: BASE_URL https://dev.minimoi.ai, in-network backends, and the
#     two Guild dev surfaces (/guild-next, /guild-proto) switched on. The
#     flags are set here only; docker-compose.prod.yml never sets them.
#   * system-bot and cos-bot sit behind the "bots" profile: off unless
#     scripts/staging/up.sh finds $MINIMOI_ROOT/state/bots.on, i.e. after the
#     native test-bot pollers are retired (one poller per token).
#   * the model gateway is also on the internal network minimoi-staging-mc-net,
#     permanently, for Master Craftsman's own Compose project
#     (docker-compose.mc.yml, scripts/staging/mc.sh). Production has no MC.
#   * extra loopback ports kept for the Mac-only Records beta: the model
#     gateway on 127.0.0.1:14000 and Agent A on 127.0.0.1:18790.
#   * the model gateway reads $MINIMOI_ROOT/config/litellm.staging.yaml
#     (production logical names, lower-cost CoS model) instead of the baked
#     production config.
#   * volumes are external and staging-named: `compose down -v` cannot touch
#     them, and they never collide with the old dev volumes.
#   * the IoT Connect stack is not part of staging; the portal's edge network
#     gets a staging-only name so it never joins a local iotconnect network.
#     /app/iotconnect answers "unavailable" on staging, as expected.
#
# Host paths come from docker-compose.prod.yml's ${MINIMOI_ROOT:-/opt/minimoi};
# this file adds no host path of its own except the gateway config, which
# also lives under ${MINIMOI_ROOT}.

services:
  postgres:
    pull_policy: never

  model-gateway:
    image: minimoi-staging/cos-scheduler:model-gateway-${MINIMOI_IMAGE_TAG:?run scripts/staging/build.sh}
    pull_policy: never
    volumes:
      - ${MINIMOI_ROOT:?set MINIMOI_ROOT (scripts/staging/lib.sh)}/config/litellm.staging.yaml:/app/config.yaml:ro
      # The usage recorder (usage-record U1; staging only): its code, copied
      # from services/usage/ by build.sh, and the environment's usage store.
      - ${MINIMOI_ROOT}/config/usage/usage_record.py:/app/usage_record.py:ro
      - ${MINIMOI_ROOT}/config/usage/litellm_recorder.py:/app/usage_recorder.py:ro
      - ${MINIMOI_ROOT}/data/usage:/app/usage-data
    ports:
      - "127.0.0.1:14000:4000"
    environment:
      # Provider keys under gateway-only names (litellm.staging.yaml), and the
      # default names emptied: LiteLLM's pass-through routes (/anthropic/* and
      # the provider factory routes) sign upstream calls with ANTHROPIC_API_KEY
      # / XAI_API_KEY, so with those empty no pass-through call can spend on
      # CoS's provider accounts (v0.8 review finding 1). Staging only.
      - GATEWAY_ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:?set ANTHROPIC_API_KEY in .env}
      - GATEWAY_XAI_API_KEY=${XAI_API_KEY:?set XAI_API_KEY in .env}
      - ANTHROPIC_API_KEY=
      - XAI_API_KEY=
      # Master Craftsman's own provider key, for minimoi-mc-agent only. Never
      # empty: a placeholder Anthropic refuses until Robert's `mc.sh
      # gateway-keys` puts MC's real key in mc.env (interpolation only).
      - MC_ANTHROPIC_API_KEY=${MC_ANTHROPIC_API_KEY:-mc-anthropic-placeholder-not-a-key}
      # The usage store (usage-record U1): one file per month, mode 600.
      - MINIMOI_USAGE_DIR=/app/usage-data
      - MINIMOI_ENV=staging
    # Permanently on mc-net (MC spec v0.9 §3), so starting or stopping Master
    # Craftsman's own project never recreates the gateway. The gateway keeps
    # `default` for CoS and provider egress.
    networks:
      - default
      - mc-net

  cos-agent-a:
    image: minimoi-staging/cos-scheduler:agent-a-${MINIMOI_IMAGE_TAG:?run scripts/staging/build.sh}
    pull_policy: never
    ports:
      - "127.0.0.1:18790:18789"

  curator:
    image: minimoi-staging/curator:${MINIMOI_IMAGE_TAG:?run scripts/staging/build.sh}
    pull_policy: never
    environment:
      - MINIMOI_ROLE=standby

  german:
    image: minimoi-staging/mein-deutsch:${MINIMOI_IMAGE_TAG:?run scripts/staging/build.sh}
    pull_policy: never
    environment:
      - MINIMOI_ROLE=standby

  portuguese:
    image: minimoi-staging/portuguese:${MINIMOI_IMAGE_TAG:?run scripts/staging/build.sh}
    pull_policy: never
    environment:
      - MINIMOI_ROLE=standby

  portal:
    image: minimoi-staging/portal:${MINIMOI_IMAGE_TAG:?run scripts/staging/build.sh}
    pull_policy: never
    environment:
      - MINIMOI_ROLE=standby
      - BASE_URL=https://dev.minimoi.ai
      - CURATOR_BACKEND=http://curator:8766
      - GERMAN_BACKEND=http://german:8767
      - PORTUGUESE_BACKEND=http://portuguese:8770
      # B1 deliverable (b): the Shop floor at /guild-next and the frozen
      # prototype at /guild-proto. Staging only; unset in production.
      - MINIMOI_GUILD_NEXT=1
      - MINIMOI_GUILD_PROTO=1
      # Guild's Systems light reads the Mac's native Operations agent (launchd,
      # bound to 127.0.0.1:8768). Colima forwards host.docker.internal
      # (192.168.5.2) to the Mac's loopback, so the portal container reaches it.
      - GUILD_OPERATIONS_STATUS_URL=${GUILD_OPERATIONS_STATUS_URL:-http://host.docker.internal:8768/status}
      # Master Craftsman (MC spec v0.9 §4, stage B), staging only. From
      # $STAGING_ROOT/state/mc.mode and state/mc.turns (lib.sh); off by
      # default. The portal reaches MC only through the relay, with the relay's
      # caller token from mc.env (interpolation only); it never holds MC's own
      # OpenClaw token.
      - MINIMOI_GUILD_MC=${MINIMOI_GUILD_MC:-off}
      - MINIMOI_GUILD_MC_TURNS=${MINIMOI_GUILD_MC_TURNS:-off}
      # Streaming (streaming spec v0.2 §5): on for staging; the code default
      # is off, and /guild-next never mounts in production.
      - MINIMOI_GUILD_MC_STREAM=${MINIMOI_GUILD_MC_STREAM:-on}
      - MC_RUNTIME_URL=http://mc-relay:8790/v1
      - MC_RUNTIME_TOKEN=${MC_RELAY_TOKEN:-}
      # The usage store, read-only (usage-record U3): the Shop floor footer's
      # output tokens. MC's own runtime-stream records (streaming S1) go only to
      # usage/portal, mounted read-write below: the portal never creates or
      # touches the gateway's shared monthly file (#275 review, finding 4).
      - MINIMOI_USAGE_DIR=/app/data/usage
      # The local Workshop's record, read-only (4a): synced from the Mac by
      # scripts/workshop/workshop.py sync; the portal never writes it.
      - MINIMOI_WORKSHOPS_DIR=/app/data/workshops
      - MINIMOI_WORKSHOP_ID=mac
      # The Guild Media library's files (Guild 1.1 slice 3, spec §5.2): images
      # live only here, on a persistent host folder (created by build.sh);
      # Postgres keeps only their index. Staging only until the production
      # cutover adds the same mount.
      - MINIMOI_MEDIA_DIR=/app/runtime/media
      # Rooms (Guild 1.1 slice 4): the one internal Records origin the portal's
      # dev-only bridge may reach (/app/records/). Records runs in its own
      # project (docker-compose.records.yml); until it is up, Rooms says
      # "unavailable". BASE_URL above is the dev origin, so the bridge installs.
      - RECORDS_BACKEND=http://minimoi-records:18880
    volumes:
      - ${MINIMOI_ROOT}/data/usage:/app/data/usage:ro
      - ${MINIMOI_ROOT}/data/usage/portal:/app/data/usage/portal
      - ${MINIMOI_ROOT}/data/workshops:/app/data/workshops:ro
      - ${MINIMOI_ROOT}/data/media:/app/runtime/media
    # Permanently on mc-front (portal + MC's relay only), so enabling MC never
    # recreates the portal (MC spec v0.9 §3).
    networks:
      - default
      - iotconnect-edge
      - mc-front
      # Permanently on records-net (portal + Records only), so starting
      # Records never recreates the portal (Guild 1.1 slice 4).
      - records-net

  system-bot:
    image: minimoi-staging/system-bot:${MINIMOI_IMAGE_TAG:?run scripts/staging/build.sh}
    pull_policy: never
    profiles: [bots]
    environment:
      - MINIMOI_ROLE=standby

  cos-bot:
    image: minimoi-staging/cos-bot:${MINIMOI_IMAGE_TAG:?run scripts/staging/build.sh}
    pull_policy: never
    profiles: [bots]
    environment:
      - MINIMOI_ROLE=standby
      # The usage store (usage-record U2): direct calls (Tavily, the Grok backend),
      # written only to this writer's own folder (usage_record.own_folder): the
      # shared monthly file is the non-root gateway's alone.
      - MINIMOI_USAGE_DIR=/app/data/usage
      - MINIMOI_USAGE_WRITER=cos-bot
      - MINIMOI_ENV=staging
    volumes:
      - ${MINIMOI_ROOT}/data/usage:/app/data/usage:ro
      - ${MINIMOI_ROOT}/data/usage/cos-bot:/app/data/usage/cos-bot

  cos-scheduler:
    image: minimoi-staging/cos-scheduler:${MINIMOI_IMAGE_TAG:?run scripts/staging/build.sh}
    pull_policy: never
    environment:
      - MINIMOI_ROLE=standby
      # The usage store (usage-record U2): direct calls (Tavily, the Grok backend),
      # written only to this writer's own folder (usage_record.own_folder): the
      # shared monthly file is the non-root gateway's alone.
      - MINIMOI_USAGE_DIR=/app/data/usage
      - MINIMOI_USAGE_WRITER=cos-scheduler
      - MINIMOI_ENV=staging
    volumes:
      - ${MINIMOI_ROOT}/data/usage:/app/data/usage:ro
      - ${MINIMOI_ROOT}/data/usage/cos-scheduler:/app/data/usage/cos-scheduler

volumes:
  postgres-data:
    external: true
    name: minimoi-staging-postgres-data
  cos-agent-a-state:
    external: true
    name: minimoi-staging-cos-agent-a-state
  cos-agent-a-auth:
    external: true
    name: minimoi-staging-cos-agent-a-auth

networks:
  iotconnect-edge:
    name: minimoi-staging-iotconnect-edge
  # Master Craftsman's only network (MC spec v0.9 §3): internal, so no egress.
  # Members: model-gateway (here, permanently) and, from MC's own project
  # (docker-compose.mc.yml), mc-agent. Nothing else of the main stack joins it.
  mc-net:
    name: minimoi-staging-mc-net
    internal: true
    # No host address on the bridge (Docker 28+; #250 review F1): otherwise a
    # container on this internal network can still reach the Colima VM itself
    # (for example its sshd on :22) through the bridge's own IP. Containers on
    # the network still reach each other (MC -> model-gateway).
    driver_opts:
      com.docker.network.bridge.gateway_mode_ipv4: isolated
  # The portal's side of the one-way relay (MC spec v0.9 §3-§4): members are
  # the portal (here, permanently) and, from MC's own project, mc-relay only.
  # Internal, and no host address on the bridge.
  # Rooms' only network (Guild 1.1 slice 4): internal, so Records has no
  # egress. Members: the portal (here, permanently) and, from Records' own
  # project (docker-compose.records.yml), minimoi-records.
  records-net:
    name: minimoi-staging-records
    internal: true
  mc-front:
    name: minimoi-staging-mc-front
    internal: true
    driver_opts:
      com.docker.network.bridge.gateway_mode_ipv4: isolated
