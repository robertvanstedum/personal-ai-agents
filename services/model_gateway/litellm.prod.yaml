# MinimoI shared model gateway — production routes
# Production intentionally omits the Mac-hosted Ollama fallback.

model_list:
  - model_name: minimoi-cos-agent
    litellm_params:
      model: xai/grok-4.3
      api_key: os.environ/XAI_API_KEY
      timeout: 120
      reasoning_effort: low
    model_info:
      id: cos-xai-primary
      base_model: xai/grok-4.3
      mode: chat
      supports_function_calling: true
      fallback_position: 0

  - model_name: minimoi-cos-agent-xai-fast
    litellm_params:
      model: xai/grok-4.3
      api_key: os.environ/XAI_API_KEY
      timeout: 120
      reasoning_effort: none
    model_info:
      id: cos-xai-fast
      base_model: xai/grok-4.3
      mode: chat
      supports_function_calling: true
      fallback_position: 1

  - model_name: minimoi-cos-web-search
    litellm_params:
      model: xai/grok-4.3
      api_key: os.environ/XAI_API_KEY
      timeout: 60
      reasoning_effort: low
    model_info:
      id: cos-xai-bounded-web-search
      base_model: xai/grok-4.3
      mode: responses
      supports_web_search: true

  - model_name: minimoi-cos-agent-anthropic
    litellm_params:
      model: anthropic/claude-sonnet-4-6
      api_key: os.environ/ANTHROPIC_API_KEY
      timeout: 120
    model_info:
      id: cos-anthropic-secondary
      base_model: anthropic/claude-sonnet-4-6
      mode: chat
      supports_function_calling: true
      fallback_position: 2

  # The voice summary (Spec 165 §5.4, D22 (a)): one plain completion, no tools, after a voice session ends. Reached only
  # with the capped keys voice-summary-mc and voice-summary-cos (core/realtime_voice/summary_gateway.py). The server bounds
  # each attempt at 35 s.
  - model_name: minimoi-voice-summary
    litellm_params:
      model: xai/grok-4.3
      api_key: os.environ/XAI_API_KEY
      timeout: 30
      reasoning_effort: none
    model_info:
      id: voice-summary-xai
      base_model: xai/grok-4.3
      mode: chat

  # The voice understanding call (confirm by voice, v3; core/realtime_voice/intent_gateway.py): one plain completion of a
  # few tokens, no tools, for one finished owner utterance the grammar did not hear; it answers one word and acts on
  # nothing. Reached only with the same capped keys as the summary (voice-summary-mc, voice-summary-cos). The server
  # bounds each call at 2.5 s and never retries.
  - model_name: minimoi-voice-intent
    litellm_params:
      model: xai/grok-4.3
      api_key: os.environ/XAI_API_KEY
      timeout: 5
      reasoning_effort: none
    model_info:
      id: voice-intent-xai
      base_model: xai/grok-4.3
      mode: chat

router_settings:
  fallbacks:
    - minimoi-cos-agent:
        - minimoi-cos-agent-xai-fast
        - minimoi-cos-agent-anthropic
  num_retries: 0
  allowed_fails: 1
  cooldown_time: 60
  timeout: 180
  enable_pre_call_checks: true

litellm_settings:
  drop_params: true
  set_verbose: false
  callbacks:
    - receipt_callback.receipt_callback

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  disable_spend_logs: true
  disable_error_logs: false
  store_model_in_db: false
  disable_admin_ui: true
