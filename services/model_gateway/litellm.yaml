# MinimoI shared model gateway
#
# Provider order and fallback policy live here, never in domain business code.
# Secret values are resolved from the gateway container environment.

# ── Logical models and concrete deployments ──────────────────────────────────

model_list:
  - model_name: minimoi-cos-agent
    litellm_params:
      model: xai/grok-4.3
      api_key: os.environ/XAI_API_KEY
      timeout: 120
      reasoning_effort: low
    model_info:
      id: cos-xai-primary
      base_model: xai/grok-4.3
      mode: chat
      supports_function_calling: true
      fallback_position: 0

  - model_name: minimoi-cos-agent-xai-fast
    litellm_params:
      model: xai/grok-4.3
      api_key: os.environ/XAI_API_KEY
      timeout: 120
      reasoning_effort: none
    model_info:
      id: cos-xai-fast
      base_model: xai/grok-4.3
      mode: chat
      supports_function_calling: true
      fallback_position: 1

  # Stable search route used by the bounded OpenClaw provider. Concrete model
  # selection stays here so it can be swapped without changing Agent A.
  - model_name: minimoi-cos-web-search
    litellm_params:
      model: xai/grok-4.3
      api_key: os.environ/XAI_API_KEY
      timeout: 60
      reasoning_effort: low
    model_info:
      id: cos-xai-bounded-web-search
      base_model: xai/grok-4.3
      mode: responses
      supports_web_search: true

  - model_name: minimoi-cos-agent-anthropic
    litellm_params:
      model: anthropic/claude-sonnet-4-6
      api_key: os.environ/ANTHROPIC_API_KEY
      timeout: 120
    model_info:
      id: cos-anthropic-secondary
      base_model: anthropic/claude-sonnet-4-6
      mode: chat
      supports_function_calling: true
      fallback_position: 2

  # OpenAI is intentionally absent until its credential, exact model ID, tool
  # support, and live acceptance have all passed. Do not add a false fallback.

  # Explicit local regression route; never an automatic cloud fallback.
  - model_name: minimoi-cos-agent-local
    litellm_params:
      model: ollama_chat/llama3.2:3b
      api_base: os.environ/OLLAMA_API_BASE
      timeout: 180
    model_info:
      id: cos-ollama-local
      base_model: llama3.2:3b
      mode: chat

# ── Ordered reliability policy ────────────────────────────────────────────────

  # The voice summary (Spec 165 §5.4, D22 (a)): one plain completion, no tools, after a voice session ends. Reached only
  # with the capped keys voice-summary-mc and voice-summary-cos (core/realtime_voice/summary_gateway.py). The server bounds
  # each attempt at 35 s.
  - model_name: minimoi-voice-summary
    litellm_params:
      model: xai/grok-4.3
      api_key: os.environ/XAI_API_KEY
      timeout: 30
      reasoning_effort: none
    model_info:
      id: voice-summary-xai
      base_model: xai/grok-4.3
      mode: chat

router_settings:
  fallbacks:
    - minimoi-cos-agent:
        - minimoi-cos-agent-xai-fast
        - minimoi-cos-agent-anthropic
  num_retries: 0
  allowed_fails: 1
  cooldown_time: 60
  timeout: 180
  enable_pre_call_checks: true

# ── Gateway behavior and authentication ───────────────────────────────────────

litellm_settings:
  drop_params: true
  set_verbose: false
  callbacks:
    - receipt_callback.receipt_callback

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  disable_spend_logs: true
  disable_error_logs: false
  store_model_in_db: false
  disable_admin_ui: true
